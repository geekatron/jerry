# Dependabot Configuration -- Risk-Tiered Dependency Management (#188)
#
# DESIGN RATIONALE (8 decisions):
#
# D1: uv group structure (verified #188; update when dep count changes)
#   - "uv-minor-patch" group: patch + minor updates together (low ceremony).
#   - Major updates: ungrouped (each gets its own PR for manual review).
#   - Dev/test deps are NOT separated from runtime deps because:
#     (a) Jerry's dep count is small (~20 direct). Separate groups
#         would produce 2 PRs where 1 suffices with no loss of visibility.
#     (b) CI runs the full test suite on every PR regardless, so a broken
#         test dep is caught the same way as a broken runtime dep.
#     (c) The risk profile of patch/minor is the same for both categories.
#     If the dep count grows past ~40, reconsider splitting by adding a
#     second group with `dependency-type: "development"`.
#   - DEVIATION from risk analysis (R-3, R-4): The FMEA raised three
#     independent concerns: (1) transitive conflict risk (RPN 120),
#     (2) user-facing blast radius for runtime deps, (3) pytest ecosystem
#     coupling. The `allow: direct` policy (D3) addresses concern #1 only
#     (prevents standalone transitive PRs). Concerns #2 and #3 are
#     accepted at current scale: (2) ~7 runtime deps produce low PR
#     volume; CI catches breakage pre-merge; (3) pytest deps share no
#     cross-constraints with non-pytest dev tools (ruff, pyright, mypy).
#     Revisit if dep count exceeds ~40 or if runtime dep breakage occurs.
#     See: projects/PROJ-030-bugs/research/dependabot-risk-analysis.md
#
# D2: github-actions group structure
#   - "actions-minor-patch" group: patch + minor SHA rotations (low risk;
#     all actions are SHA-pinned per EN-001, so even "minor" is a SHA swap).
#   - Major updates: ungrouped. Jerry just merged v5->v6 (checkout) and
#     v4->v7 (setup-uv) after individual review. Major action bumps can
#     change behavior (e.g., Node.js runtime version, input/output schema).
#     These warrant individual PRs with manual review.
#   - CONSERVATIVE OVERRIDE of risk analysis (R-1): The FMEA recommended
#     grouping ALL Actions (including major) since SHA pinning makes even
#     major bumps "just a hash change." This config is MORE conservative —
#     major bumps stay individual because they CAN change runtime behavior
#     (Node.js version, input schemas) regardless of the pin mechanism.
#     (Historical example: v5->v6 checkout, v4->v7 setup-uv merged
#     individually in March 2026; reassess after 90 days of operation)
#
# D3: Transitive dependency handling
#   - Using `allow` with `dependency-type: direct` for the uv ecosystem.
#     This tells Dependabot to only open PRs for packages listed directly
#     in pyproject.toml, not for transitive deps like gherkin-official
#     (pulled in by pytest-bdd).
#   - Why `allow` instead of `exclude-patterns` (vs. risk analysis R-5):
#     (a) gherkin-official 29->39 was a transitive dep conflict (PR #168,
#         March 2026; tracked as #190). Excluding
#         it by name is whack-a-mole; new transitive deps appear over time.
#         R-5 recommended an explicit ignore list; `allow: direct` is more
#         durable and achieves the same outcome with a single policy line.
#     (b) `allow: dependency-type: direct` is a durable policy: Dependabot
#         only touches what we explicitly declared. Transitive deps update
#         when their parent direct dep is bumped (e.g., pytest-bdd bump
#         pulls in the compatible gherkin-official version via uv.lock).
#   - HOW IT WORKS: Dependabot classifies deps as direct/indirect via
#     pyproject.toml alone. Packages listed in [dependencies],
#     [project.optional-dependencies], or [dependency-groups] are
#     classified as direct — this is Jerry's sole dependency manifest
#     (uv ecosystem; H-05 uv-only mandate). uv.lock is updated atomically
#     alongside pyproject.toml in each Dependabot PR.
#     Debug: if an unexpected VERSION-update PR appears, check
#     pyproject.toml — if the package is not declared there it should not
#     be getting one (the allow: direct policy should have suppressed it;
#     file a bug). SECURITY-update PRs for undeclared packages are
#     expected: see the CAVEAT below.
#   - CAVEAT (corrected 2026-11): transitive dep VERSION updates do not
#     generate a Dependabot PR, but transitive dep SECURITY updates can.
#     In Oct 2026 the uv security PRs for pip, httpx2, httpcore2, anyio,
#     urllib3, virtualenv and certifi were security updates for indirect
#     uv.lock entries (PR metadata `dependency-type: indirect`), and
#     `allow: direct` did not stop them. Docs: "Dependabot can update an
#     indirect (transitive) dependency to a secure version". Not every
#     advisory gets a PR, or gets one at once (on 2026-10-24 there was
#     none for certifi or filelock), so the DETECTION controls below
#     remain required.
#     Compensating DETECTION controls: `pip-audit` in CI catches
#     known CVEs; `uv.lock` diff review on grouped PRs is the PRIMARY
#     mechanism for spotting transitive shifts (requirements files no
#     longer exist; uv.lock is the sole source of transitive visibility).
#     These are detectors, not remediators — a transitive CVE
#     still requires manual intervention (bump the parent dep or add an
#     explicit override). Maximum transitive CVE detection latency: up to
#     24 hours (daily scheduled security-scan.yml runs pip-audit against
#     the locked dependency tree independent of PR activity).
#     REMEDIATION when a transitive CVE is detected:
#       1. Identify which direct dep pulls in the vulnerable transitive
#       2. Bump the direct dep: `uv add <pkg>@latest && uv lock`
#       3. If no direct dep update fixes it: `uv add <vulnerable-pkg>>=<fixed>`
#          to make it a direct dep temporarily
#       4. Run `uv run pip-audit` to verify the fix
#     See: .github/workflows/security-scan.yml
#     (C4 tournament: S-001 RT-002, S-004 PM-001, S-012 FM-009)
#   - GitHub Actions are all direct references (no transitive concept), so
#     no `allow` restriction is needed there.
#
# D4: Security update handling (updated 2026-11)
#   - Security updates stay UNGROUPED: each CVE gets its own PR with clear
#     visibility into what vulnerability it addresses. A group for uv
#     security updates was considered in 2026-10 and not adopted: every uv
#     security fix would go through one PR that a single failing or stuck
#     member can hold, it cannot be tested before a real advisory, and its
#     safety net (an owner and a response target for security alerts) is
#     not decided. Re-entry conditions: that owner and response target
#     exist, and a check fails when an advisory has no open PR or a group
#     PR is stuck. Limit such a group to `update-types: [minor, patch]` so
#     that majors stay individual.
#   - Dependabot security updates are event-driven (triggered by GitHub
#     Advisory Database updates), not schedule-driven. The `schedule`
#     interval controls version updates only. Security update PRs are
#     created as soon as a compatible fix is available, regardless of the
#     configured schedule.
#   - Note (corrected 2026-11): security-update PRs have their own fixed
#     limit; docs: "Security update pull requests are subject to a
#     separate, fixed limit of 10 open pull requests, which cannot be
#     configured using `open-pull-requests-limit`". So
#     `open-pull-requests-limit` configures version updates only, and the
#     earlier note (CC-005) that it applies to security PRs is superseded.
#     Unmerged security PRs use up the 10, so an aging backlog of them can
#     hold back new ones.
#   - Security updates must be enabled in repo Settings > Code security >
#     Dependabot security updates. No additional dependabot.yml config is
#     needed to keep them ungrouped (that is the default behavior).
#   - If we later want to GROUP security updates, add a group with
#     `applies-to: security-updates` inside the relevant ecosystem block.
#
# D5: Commit message prefix
#   - "ci" for actions, "deps" for uv, "chore" for pre-commit. Unchanged
#     from current config for ci/deps. "chore" for pre-commit because hook
#     SHA rotations are maintenance (not feature-deps, not CI infra).
#   - "ci", "deps" AND "chore" are all in version-bump.yml Filter B's skip
#     list (#187; also docs, style, refactor, test, build, revert).
#     Correction (2026-11): this note used to say "chore" was NOT filtered.
#     Filter B reads the first line of the head commit message, so it
#     decides squash merges (normally the PR title) and rebase merges (the
#     last replayed commit). A merge commit's message starts with "Merge
#     pull request", which passes Filter B; for a merge commit only the
#     "[skip-bump]" marker can skip the job, and it must be in the PR
#     title, which becomes the merge commit's body. The marker anywhere in
#     the head commit message skips the job. Otherwise
#     `jerry ci detect-bump-type` decides: only feat (minor), fix or perf
#     (patch), `!` or a "BREAKING CHANGE:" footer (major) bump the version.
#   - No downstream impact from prefix choice beyond Filter B. Labels
#     provide the risk-level signaling (see D7).
#
# D6: open-pull-requests-limit (verified #188; update when dep count changes)
#   - Actions: 10 (unchanged). With grouping, patch+minor collapses to ~1
#     grouped PR consuming 1 slot. Effective ceiling for individual major
#     PRs is 9. Jerry uses ~7 distinct actions, so headroom is adequate.
#   - Pip: 5 -> 10. With direct-only filtering (D3), the grouped PR count
#     is small (~1 for patch/minor, consuming 1 slot). The limit of 10
#     accommodates individual major-version PRs for the ~8 direct runtime deps plus
#     ~4 direct dev deps. The old limit of 5 could queue PRs when
#     multiple majors are pending simultaneously.
#   - pre-commit: 5. Only 3 external hook repos exist today
#     (pre-commit-hooks, ruff-pre-commit, commitizen). Limit of 5 provides
#     headroom if new hooks are added later. No grouping: each hook repo
#     gets its own PR, providing a clear SHA rotation audit trail with
#     changelog context per D2 rationale (each hook update can change
#     behavior independently). TASK-034.
#
# D7: Labels (verified #188; reassess after 90 days of operation)
#   - All Dependabot PRs get "dependencies" (existing).
#   - Actions PRs additionally get "ci" (existing).
#   - No risk-tier labels added. At Jerry's current PR volume (~2-4 PRs
#     per week after grouping), the PR title already communicates risk:
#     grouped PRs say "Bump the X group" (low risk), individual PRs show
#     the specific major version change (review required). Adding labels
#     like "risk:low" would require creating the label first and provides
#     marginal value at this scale.
#
# D8: Cooldown (added 2026-11)
#   - GitHub applies a default 3-day cooldown to VERSION updates even when
#     none is configured (docs: "Apply a default cooldown period of 3 days
#     to version updates, even when `cooldown` is not configured"). This
#     file raises it to 7 days (14 for uv major versions) for uv,
#     github-actions and pre-commit. The durations are a judgment: a
#     wait before adopting fresh releases that a weekly update cadence
#     already tolerates. A small sample of public incident
#     timelines (10 incidents; 8 attack windows under a week, 9 under 14
#     days) is consistent with them but does not derive them. Review on
#     2027-01-31 against observed adoption lag and any new incident
#     evidence; revert this block if it delays fixes that matter.
#   - NOT delayed: security updates (docs: "The `cooldown` option is only
#     available for version updates, not security updates"). A malicious
#     "fix release" could still be proposed at once, so human review,
#     pip-audit and a supply-chain check remain the controls for security
#     PRs. In Oct 2026 most dependency traffic was security updates and
#     hand-made bumps, which the cooldown does not cover.
#   - github-actions and pre-commit accept only `default-days`; among the
#     three ecosystems in this file only uv accepts the semver-* keys
#     (docs, cooldown section, which marks support per ecosystem).
#
# REFERENCES:
#   - Research: projects/PROJ-030-bugs/research/merge-queue-vs-dependabot-grouping.md
#   - Risk analysis (FMEA): projects/PROJ-030-bugs/research/dependabot-risk-analysis.md
#   - Supply chain assessment: projects/PROJ-030-bugs/research/dependabot-risk-analysis.md
#   - C4 tournament reviews: projects/PROJ-030-bugs/reviews/188-s0*.md
#   - Security scan: .github/workflows/security-scan.yml (daily pip-audit)
#   - Filter B: .github/workflows/version-bump.yml (#187)
#   - SHA pinning: EN-001
#   - Dependabot options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#   - Cooldown incident sample (10 incidents, 2025-11-21): https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns

version: 2

updates:
  # ==================================================================
  # GitHub Actions -- weekly check for pinned SHA updates
  # ==================================================================
  # Jerry SHA-pins all actions per EN-001. Dependabot detects when a new
  # release is available and proposes the updated SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 10
    # D8: see the cooldown rationale in the header (default-days only for
    # Actions).
    cooldown:
      default-days: 7
    groups:
      # D2: Patch + minor SHA rotations are low-risk for pinned actions.
      # Produces ~1 grouped PR per week instead of ~7 individual PRs.
      # Example: actions/checkout v6.0.1 -> v6.0.2 (patch SHA swap).
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Major updates (e.g., actions/checkout v6->v7) remain ungrouped.
    # Each gets its own PR for individual review of breaking changes.

  # ==================================================================
  # GitHub Actions (shared audit step) -- added 2026-11 (extends D2)
  # ==================================================================
  # Composite actions live OUTSIDE .github/workflows, and directory "/"
  # does not cover them (docs, for "/": "Dependabot will search the
  # `/.github/workflows` directory, as well as the `action.yml/action.yaml`
  # file from the root directory"). Evidence of the gap: the shared audit
  # step, .github/actions/security-audit/action.yml, pins
  # astral-sh/setup-uv v8.1.0 while every workflow file that names setup-uv
  # pins v9.0.0 (2026-11).
  # That step runs the dependency audit, so a stale pin there matters.
  # VALIDATE on the first Monday run after merge: the docs do not describe
  # composite-action directories. The Dependabot log should list
  # action.yml and astral-sh/setup-uv; if it does not, remove this entry.
  # The 7-day cooldown below can delay the first PR.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/security-audit"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    # D8: default-days only, as for the workflows' entry above.
    cooldown:
      default-days: 7
    groups:
      # D2: patch + minor SHA rotations together; majors stay individual.
      security-audit-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ==================================================================
  # uv -- weekly check for Python dependency updates
  # ==================================================================
  # Uses uv ecosystem (not pip) so Dependabot updates both pyproject.toml
  # AND uv.lock together, preventing lockfile drift.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # D8: 7 days for everything, 14 for majors (security updates unaffected).
    cooldown:
      default-days: 7
      semver-major-days: 14
    # D3: Only bump direct dependencies declared in pyproject.toml.
    # Transitive deps (gherkin-official, mako, markupsafe, coverage,
    # pluggy, etc.) update when their parent direct dep is bumped and
    # uv.lock is regenerated. (Observed 2026-10: `allow: direct` did not
    # stop security updates for indirect lock entries -- see the D3 caveat.)
    allow:
      - dependency-type: "direct"
    # HOLD (2026-11-19): webvtt-py stays below 0.6. From 0.6.0 it skips
    # malformed cues when reading instead of raising MalformedCaptionError
    # (unless strict=True), so the transcript parser would report a damaged
    # file as complete instead of failed, and 0.8.0 reads 899 cues where
    # 0.5.1 read 896 in one test transcript. Two tests caught both in the
    # group pull request #444. Remove this entry once the parser handles
    # skipped cues and those tests are updated (follow-up issue).
    ignore:
      - dependency-name: "webvtt-py"
        versions: [">=0.6.0"]
    groups:
      # D1: Patch + minor updates grouped together. SemVer contract says
      # these should be backward-compatible. CI catches the exceptions.
      # Produces ~1 grouped PR instead of ~5-8 individual PRs.
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Major updates (e.g., pytest 9->10, ruff 1->2) remain ungrouped.
    # Each gets its own PR for individual review. Major version bumps
    # may require code changes (API removals, behavior changes).
    # NOTE: ruff uses 0.x versioning where 0.x->0.(x+1) is semantically
    # major (new default-enabled lint rules). Dependabot classifies these
    # as "minor" — review ruff grouped PRs with extra care. (PM-008)
    # RUFF LOCKSTEP (2026-11): ruff is pinned twice -- in uv.lock (used by CI
    # and `uv run ruff`) and as the ruff-pre-commit hook rev in
    # .pre-commit-config.yaml (used locally; no workflow runs pre-commit).
    # Merge a ruff bump in one ecosystem only together with, or after, the
    # matching bump in the other, so both report the same version (history:
    # the ruff 0.15 -> 0.16 update forced a 324-file Markdown reformat; see
    # CHANGELOG).
    #
    # REVIEWER GUIDE for grouped PRs (DA-004, RT-001):
    #   If a grouped PR fails CI:
    #     1. Check which dep broke: read the test failure output
    #     2. Comment `@dependabot ignore <pkg> minor version` to exclude it
    #     3. Dependabot recreates the group without the excluded dep
    #     4. The excluded dep gets its own individual PR for separate review
    #   If you need to split a group entirely:
    #     1. Close the grouped PR
    #     2. Temporarily remove the `groups:` block from this file
    #     3. Dependabot creates individual PRs on next schedule run
    #     4. Identify and fix the problem, then restore the groups block
    #   Supply chain verification before merging ANY dep PR (RT-001):
    #     1. Review the uv.lock diff — check for unexpected transitive changes
    #     2. Verify pip-audit passed in CI (check the security-scan job)
    #     3. For unfamiliar packages: check PyPI release date and changelog
    #     4. For grouped PRs: scan each package individually, not just CI result
    #   Post-merge regression (PM-003):
    #     If breakage surfaces after merge (CI passed but runtime fails):
    #     1. Revert the merged PR: `git revert <commit>` for a squash merge,
    #        or `git revert -m 1 <merge-commit>` for a merge commit (without
    #        -m git refuses: "is a merge but no -m option was given"). To
    #        re-land, revert the revert; merging the same branch again
    #        reports "Already up to date" and does nothing.
    #     2. Open an issue tracking which dep caused the regression
    #     3. Re-merge the group without the problematic dep

  # ==================================================================
  # pre-commit -- weekly check for hook SHA updates (TASK-034)
  # ==================================================================
  # Supported since 2026-03-10 (https://github.blog/changelog/2026-03-10-dependabot-now-supports-pre-commit-hooks/)
  #
  # All 3 external hook repos in .pre-commit-config.yaml are SHA-pinned
  # (TASK-024). Dependabot detects when a new tag is released and proposes
  # the updated SHA, replacing the manual `pre-commit autoupdate --freeze`
  # workflow that was previously required.
  #
  # External repos covered:
  #   - https://github.com/pre-commit/pre-commit-hooks (hygiene hooks)
  #   - https://github.com/astral-sh/ruff-pre-commit   (linter/formatter)
  #   - https://github.com/commitizen-tools/commitizen (commit-msg linting)
  #
  # No grouping: each hook repo gets its own PR. Hook updates are
  # independent (a ruff bump has no relationship to a commitizen bump),
  # and SHA-pinned updates benefit from individual changelog review.
  # This mirrors the D2 rationale for major GitHub Actions updates.
  # Exception (2026-11): the ruff hook shadows the ruff version in uv.lock --
  # see RUFF LOCKSTEP in the uv block. No workflow runs pre-commit, so a
  # green CI result on a hook PR proves nothing about the hook.
  #
  # "chore" prefix: hook SHA rotations are maintenance, not a feature
  # dependency update or CI infrastructure change. See D5 for Filter B
  # (version-bump.yml) implications — "chore" IS in the skip list, and a
  # merge commit passes Filter B (D5).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # D8: default-days only (semver-* keys are not supported for pre-commit).
    cooldown:
      default-days: 7
