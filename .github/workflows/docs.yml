# Jerry Framework Documentation Pipeline
# Deploys MkDocs site to GitHub Pages on push to main.
#
# Trigger: push to main when docs/, mkdocs.yml, or overrides/ change
# Permissions: contents:write (required for gh-pages branch push)
# Jobs: deploy (single job — builds and deploys MkDocs via uv run)
#
# Security ref: docs/reference/ci-cd-pipeline-security.md

name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      # EN-001/H-002: Use uv with --frozen instead of pip with floating constraint
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.10.9"
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Deploy docs
        run: uv run mkdocs gh-deploy --force
