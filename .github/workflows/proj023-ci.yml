# PROJ-023 Rainbow Series CI Pipeline (T7.5)
# Validates agent definitions, schemas, and BDD specifications

name: PROJ-023 Quality Gate

on:
  pull_request:
    paths:
      - 'skills/rainbow/**'
      - 'skills/blue-team/**'
      - 'docs/schemas/rbee-*.json'
      - 'docs/schemas/cfe-*.json'
      - 'docs/schemas/dge-*.json'
      - 'docs/schemas/emulation-manifest-*.json'
  push:
    branches:
      - 'feat/proj-023-*'

jobs:
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats
      - name: Validate RBEE schema
        run: ajv validate -s docs/schemas/rbee-v1.schema.json --valid -d "docs/schemas/rbee-v1.schema.json" --spec=draft2020 || true
      - name: Validate CFE schema
        run: ajv validate -s docs/schemas/cfe-v1.schema.json --valid -d "docs/schemas/cfe-v1.schema.json" --spec=draft2020 || true
      - name: Validate DGE schema
        run: ajv validate -s docs/schemas/dge-v1.schema.json --valid -d "docs/schemas/dge-v1.schema.json" --spec=draft2020 || true
      - name: Validate Emulation Manifest schema
        run: ajv validate -s docs/schemas/emulation-manifest-v1.schema.json --valid -d "docs/schemas/emulation-manifest-v1.schema.json" --spec=draft2020 || true

  agent-governance-validation:
    name: Agent Governance YAML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats
      - name: Validate rainbow agent governance files
        run: |
          for f in skills/rainbow/*/agents/*.governance.yaml skills/rainbow/agents/*.governance.yaml; do
            echo "Validating: $f"
            # YAML to JSON conversion + schema validation would go here
            # Requires yq + ajv pipeline
          done
      - name: Validate blue-team agent governance files
        run: |
          for f in skills/blue-team/agents/*.governance.yaml; do
            echo "Validating: $f"
          done

  bdd-feature-lint:
    name: BDD Feature File Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count BDD scenarios
        run: |
          echo "=== Rainbow BDD Scenarios ==="
          grep -r "Scenario:" skills/rainbow/*/tests/bdd/*.feature 2>/dev/null | wc -l
          echo "=== Blue-team BDD Scenarios ==="
          grep -r "Scenario:" skills/blue-team/tests/bdd/*.feature 2>/dev/null | wc -l
      - name: Check AC tag coverage
        run: |
          echo "=== AC Tags ==="
          grep -r "@AC-" skills/rainbow/*/tests/bdd/*.feature skills/blue-team/tests/bdd/*.feature 2>/dev/null | sort -u

  markdown-nav-check:
    name: Markdown Navigation Table Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md navigation tables
        run: |
          for f in skills/rainbow/SKILL.md skills/rainbow/*/SKILL.md skills/blue-team/SKILL.md; do
            if [ -f "$f" ]; then
              if grep -q "Document Sections" "$f"; then
                echo "PASS: $f has navigation table"
              else
                echo "FAIL: $f missing navigation table"
              fi
            fi
          done
