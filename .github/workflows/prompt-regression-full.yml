# Prompt Regression Full — Layer 1 CI/CD Gate (Tier 3: N=30 Statistical Baseline)
#
# Purpose: N=30 statistical baseline refresh across all 5 target agents. Runs all
#   four harness layers (promptfoo, DeepEval G-Eval, metamorphic relations, Wilcoxon
#   statistical comparison with Bonferroni + Wilson). Produces a complete regression
#   report per agent with confidence intervals and verdict suitable for release gating.
#
# Trigger:
#   - Manual dispatch (workflow_dispatch) — primary use case for baseline refresh
#   - Schedule: weekly on Monday 02:00 UTC (pre-release quality check)
#   - NOT triggered automatically by PRs (cost: ~$5-8 per run for all agents)
#
# Target runtime: 30-60 minutes (N=30 x 5 agents x API latency)
#
# FR traceability:
#   FR-001: YAML test case definitions (declarative promptfoo YAML) — test case files
#           delivered by Stream 3B; this workflow loads and passes them to promptfoo
#   FR-002: PR-triggered regression gate (via pre-release tag push trigger)
#   FR-003: Before/after comparison (N=30 per version for Full tier)
#   FR-004: Version key management via git commit hash
#   FR-005: Full tier — N=30, all four layers, all metamorphic relations
#   FR-010: Five universal metamorphic relations (MR-001 through MR-005)
#   FR-014: Minimum sample size enforcement (N >= 20 for Wilcoxon; enforced at runtime)
#   FR-015: Wilcoxon signed-rank comparison (full statistical validity at N=30)
#   FR-016: Wilson score confidence intervals per metric
#   FR-017: Bonferroni correction (K=13 for full suite; k=5 for simplified runs)
#   FR-018: Regression report with PR integration and blocking REGRESSION verdict
#   FR-019: Shared statistical module (jerry/testing/stats.py) — implemented in
#           Stream 3C; this workflow invokes jerry.testing.layer4_stats which imports
#           from stats.py and does not reimplement statistical logic (FR-019 compliance)
#   FR-020: Baseline store with quality gate acceptance criteria (mean >= 0.92)
#   FR-023: UV-only Python execution (H-05)
#   FR-025: promptfoo Docker isolation
#   FR-028: Model migration comparison mode (manual trigger with model override)
#
# Security controls per system-design.md Part 3 threat model:
#   MC-07: Docker hardened execution (read-only, cap-drop, no-new-privileges)
#   MC-08: Docker image pinned to version tag 0.86.0 (not :latest); SHA digest pending Docker daemon availability — see CG-007 inline
#   MC-09: Output volume validation before statistical consumption
#   MC-10: Read-only config mounts (:ro)
#   MC-13: Docker memory (4g) and CPU (4) limits — Full tier needs more resources
#   MC-14: --security-opt=no-new-privileges:true, --cap-drop=ALL
#   MC-19: API retry with exponential backoff; graceful degradation on failure
#   MC-20: Per-workflow budget ceiling ($50 for Full) via cost-monitor action
#   MC-22: Baseline quality gate enforcement (reject baselines with mean < 0.92)
#   MC-28: workflow_dispatch / schedule (not pull_request_target) — no fork access
#   MC-29: CODEOWNERS for .github/workflows/
#   MC-31: Secret masking for ANTHROPIC_API_KEY and LANGFUSE keys
#   MC-32: concurrency group prevents overlapping Full tier runs
#   MC-33: Minimal permissions block
#
# Stream: 3E (CI/CD Pipeline Setup)

name: Prompt Regression — Full

on:
  workflow_dispatch:
    inputs:
      target_agents:
        description: |
          Comma-separated agent IDs to evaluate (leave blank for all 5 default agents).
          Example: "ps-researcher,ps-analyst"
        required: false
        default: "ps-researcher,ps-analyst,ps-architect,ps-critic,adv-scorer"
      model_version:
        description: |
          Model version override for model migration testing (FR-028).
          Leave blank to use the pinned default (claude-sonnet-4-20250514).
          Providing a different version triggers model migration comparison mode.
        required: false
        default: ""
      update_baselines:
        description: |
          Whether to update baseline store after NO_REGRESSION verdict (MC-22).
          Set to 'true' only after reviewing regression reports.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reason:
        description: "Reason for manual trigger (logged in baseline manifest)"
        required: true
        default: "manual-full-evaluation"

  # Pre-release tag trigger: run Full tier on every pre-release or release tag
  # Pattern: v*.*.* (e.g., v1.2.3, v0.23.0-rc1)
  # This ensures every release candidate is validated with N=30 statistical rigor.
  push:
    tags:
      - "v*.*.*"

  schedule:
    # Weekly pre-release quality check: Monday 02:00 UTC
    # Runs against main branch; alerts on regressions vs. stored baselines
    - cron: "0 2 * * 1"

# MC-32: Only one Full tier run at a time (expensive; prevent parallel budget exhaustion)
concurrency:
  group: prompt-regression-full
  cancel-in-progress: false  # Do NOT cancel in-progress Full runs (they are expensive)

# MC-33: Principle of least privilege
permissions:
  contents: read
  pull-requests: write
  checks: write
  # Note: 'issues: write' not granted; Full tier posts to artifacts not PR comments
  # (Full tier is not typically triggered from a PR context)

env:
  # Evaluation configuration — Full tier
  EVALUATION_TIER: full
  N_RUNS_PER_VERSION: "30"
  # Default model versions — pinned per protocol.md environment requirements
  HARNESS_MODEL_VERSION: "claude-sonnet-4-20250514"
  HARNESS_JUDGE_MODEL_VERSION: "claude-sonnet-4-20250514"
  # Statistical parameters
  QUALITY_PASS_THRESHOLD: "0.92"
  STATISTICAL_ALPHA: "0.05"
  # Cost ceiling for Full tier: $50 (MC-20)
  # Full tier: N=30 x 5 agents x ~$5-8 per agent = up to $40 under normal conditions.
  # $50 ceiling provides safety margin against retry costs and model price fluctuations.
  COST_CEILING_USD: "50.00"
  TOKEN_CEILING_THOUSANDS: "5000"
  # Bonferroni K for full evaluation suite (system-design.md §1.5 Pattern 3)
  BONFERRONI_K_FULL: "13"
  # DeepEval telemetry opt-out (CG-016)
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  # ==========================================================================
  # Job 1: Validate inputs and prepare execution plan
  # ==========================================================================
  prepare:
    name: Prepare Full Evaluation Plan
    runs-on: ubuntu-latest
    outputs:
      agents_json: ${{ steps.plan.outputs.agents_json }}
      model_version: ${{ steps.plan.outputs.model_version }}
      judge_model_version: ${{ steps.plan.outputs.judge_model_version }}
      is_model_migration: ${{ steps.plan.outputs.is_model_migration }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      trigger_reason: ${{ steps.plan.outputs.trigger_reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Build execution plan
        id: plan
        shell: bash
        run: |
          # Determine target agents from input or default set
          INPUT_AGENTS="${{ github.event.inputs.target_agents || 'ps-researcher,ps-analyst,ps-architect,ps-critic,adv-scorer' }}"
          AGENTS_JSON=$(echo "$INPUT_AGENTS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "agents_json=${AGENTS_JSON}" >> "$GITHUB_OUTPUT"
          echo "Target agents: ${AGENTS_JSON}"

          # Determine model version — manual override or default pin
          OVERRIDE_MODEL="${{ github.event.inputs.model_version }}"
          if [ -n "$OVERRIDE_MODEL" ]; then
            echo "model_version=${OVERRIDE_MODEL}" >> "$GITHUB_OUTPUT"
            echo "judge_model_version=${OVERRIDE_MODEL}" >> "$GITHUB_OUTPUT"
            echo "is_model_migration=true" >> "$GITHUB_OUTPUT"
            echo "Model migration mode: ${OVERRIDE_MODEL} vs. baseline (${HARNESS_MODEL_VERSION})"
          else
            echo "model_version=${HARNESS_MODEL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "judge_model_version=${HARNESS_JUDGE_MODEL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_model_migration=false" >> "$GITHUB_OUTPUT"
            echo "Using default model version: ${HARNESS_MODEL_VERSION}"
          fi

          # Capture current HEAD SHA for version key management (FR-004)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "base_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "HEAD SHA: ${HEAD_SHA}"

          # Determine trigger reason
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REASON="scheduled-weekly-check"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REASON="${{ github.event.inputs.reason || 'manual-full-evaluation' }}"
          else
            REASON="unknown"
          fi
          echo "trigger_reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Trigger reason: ${REASON}"

  # ==========================================================================
  # Job 2: Per-agent Full tier evaluation (N=30, all four layers)
  # ==========================================================================
  full-regression:
    name: Full — ${{ matrix.agent }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    strategy:
      matrix:
        agent: ${{ fromJson(needs.prepare.outputs.agents_json) }}
      fail-fast: false  # Evaluate all agents even if one fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Install UV
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb1ce926ae18e12f4ccd  # v5.4.1
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies (including DeepEval, scipy, statsmodels)
        run: uv sync --no-dev

      - name: Mask API keys in logs (MC-31)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::add-mask::${{ secrets.ANTHROPIC_API_KEY }}"
          fi
          if [ -n "${{ secrets.LANGFUSE_SECRET_KEY }}" ]; then
            echo "::add-mask::${{ secrets.LANGFUSE_SECRET_KEY }}"
          fi

      - name: Validate test case YAML (FR-001)
        shell: bash
        run: |
          AGENT="${{ matrix.agent }}"
          TEST_YAML="tests/prompt-regression/test-cases/${AGENT}.yaml"
          if [ ! -f "$TEST_YAML" ]; then
            echo "::error::Missing test case file: $TEST_YAML"
            echo "::error::Full tier requires complete test case coverage (FR-027)"
            exit 1
          fi

      - name: Start cost monitor (MC-20)
        uses: ./.github/actions/cost-monitor
        with:
          agent_name: ${{ matrix.agent }}
          evaluation_tier: full
          cost_ceiling_usd: ${{ env.COST_CEILING_USD }}
          token_ceiling_thousands: ${{ env.TOKEN_CEILING_THOUSANDS }}
          phase: start

      - name: Run Full tier evaluation — promptfoo Docker (N=30, all layers)
        id: full-eval
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          # Use override model version if model migration mode, else default
          EVAL_MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          EVAL_JUDGE_MODEL_VERSION: ${{ needs.prepare.outputs.judge_model_version }}
          GITHUB_HEAD_SHA: ${{ needs.prepare.outputs.base_sha }}
          IS_MODEL_MIGRATION: ${{ needs.prepare.outputs.is_model_migration }}
          TRIGGER_REASON: ${{ needs.prepare.outputs.trigger_reason }}
        run: |
          # FR-005: Full tier — N=30, all four harness layers active.
          # FR-014: N >= 20 enforced at runtime by statistical engine.
          # FR-010: Metamorphic relations MR-001 through MR-005 executed.
          #
          # MC-07/MC-14: Docker hardening parameters
          # MC-13: Larger resource limits for Full tier (4g memory, 4 CPU)
          # CG-007: Version-pinned Docker image (supply chain security).
          # To upgrade to SHA pinning: docker pull <tag> && docker inspect --format='{{index .RepoDigests 0}}' <tag>
          # Then replace the tag with the @sha256: digest.
          PROMPTFOO_IMAGE="ghcr.io/promptfoo/promptfoo:0.86.0"

          mkdir -p tests/prompt-regression/results

          docker run --rm \
            --read-only \
            --security-opt=no-new-privileges:true \
            --cap-drop=ALL \
            --memory=4g \
            --cpus=4 \
            --tmpfs /tmp:rw,size=512m,noexec,nodev \
            -v "$(pwd)/tests/prompt-regression:/workspace/tests:ro" \
            -v "$(pwd)/skills:/workspace/skills:ro" \
            -v "$(pwd)/tests/prompt-regression/results:/workspace/output:rw" \
            -e ANTHROPIC_API_KEY \
            -e EVALUATION_TIER=full \
            -e N_RUNS="${N_RUNS_PER_VERSION}" \
            -e AGENT_ID="${{ matrix.agent }}" \
            -e HARNESS_MODEL_VERSION="${EVAL_MODEL_VERSION}" \
            -e HARNESS_JUDGE_MODEL_VERSION="${EVAL_JUDGE_MODEL_VERSION}" \
            -e GITHUB_HEAD_SHA \
            -e IS_MODEL_MIGRATION \
            -e TRIGGER_REASON \
            -e ENABLE_METAMORPHIC_RELATIONS=true \
            -e PROMPTFOO_CACHE_ENABLED=false \
            -e DEEPEVAL_TELEMETRY_OPT_OUT \
            "${PROMPTFOO_IMAGE}" \
            eval \
              --config "/workspace/tests/test-cases/${{ matrix.agent }}.yaml" \
              --no-progress-bar \
              --output "/workspace/output/full-${{ matrix.agent }}.json" \
            2>&1; DOCKER_EXIT=$?

          echo "docker_exit=${DOCKER_EXIT}" >> "$GITHUB_ENV"

          if [ $DOCKER_EXIT -ne 0 ]; then
            echo "::error::promptfoo Full tier evaluation failed for ${{ matrix.agent }} (exit: $DOCKER_EXIT)"
            exit 1
          fi

      - name: Validate promptfoo output (MC-09)
        shell: bash
        run: |
          RESULT_FILE="tests/prompt-regression/results/full-${{ matrix.agent }}.json"
          if [ ! -f "$RESULT_FILE" ]; then
            echo "::error::No Full tier output file found at $RESULT_FILE"
            exit 1
          fi
          uv run python -c "
          import json, sys
          with open('$RESULT_FILE') as f:
              data = json.load(f)
          if not isinstance(data, dict):
              print('ERROR: promptfoo output is not a JSON object', file=sys.stderr)
              sys.exit(1)
          # Validate N=30 run count is present in results
          results = data.get('results', {})
          print(f'Output JSON validated: OK (keys: {list(data.keys())})')
          "

      - name: Run Layer 4 statistical analysis — Wilcoxon + Wilson + Bonferroni
        id: statistical-analysis
        shell: bash
        env:
          GITHUB_HEAD_SHA: ${{ needs.prepare.outputs.base_sha }}
          PROMPT_REGRESSION_TIER: full
          BONFERRONI_K: ${{ env.BONFERRONI_K_FULL }}
        run: |
          # FR-014: InsufficientSamplesError raised if N < 20 (enforced in stats.py)
          # FR-015: Wilcoxon signed-rank comparison
          # FR-016: Wilson score confidence intervals (threshold = 0.92 = H-13)
          # FR-017: Bonferroni correction with K=13 (full evaluation suite)
          # FR-018: Regression report generation
          uv run python -m jerry.testing.layer4_stats \
            --agent "${{ matrix.agent }}" \
            --tier full \
            --results-file "tests/prompt-regression/results/full-${{ matrix.agent }}.json" \
            --head-sha "${{ needs.prepare.outputs.base_sha }}" \
            --bonferroni-k "${BONFERRONI_K}" \
            --output-report "tests/prompt-regression/results/report-full-${{ matrix.agent }}.json" \
            --output-markdown "tests/prompt-regression/results/report-full-${{ matrix.agent }}.md" \
            2>&1; STATS_EXIT=$?

          if [ $STATS_EXIT -ne 0 ]; then
            echo "::error::Statistical analysis failed for ${{ matrix.agent }} (exit: $STATS_EXIT)"
            exit 1
          fi

          # Extract verdict
          VERDICT=$(uv run python -c "
          import json
          with open('tests/prompt-regression/results/report-full-${{ matrix.agent }}.json') as f:
              data = json.load(f)
          print(data.get('classification', 'UNKNOWN'))
          " 2>/dev/null || echo "UNKNOWN")
          echo "REGRESSION_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
          echo "Full tier verdict for ${{ matrix.agent }}: ${VERDICT}"

      - name: Update baseline store if NO_REGRESSION and baseline update requested (FR-020, MC-22)
        if: |
          env.REGRESSION_VERDICT == 'NO_REGRESSION' &&
          github.event.inputs.update_baselines == 'true'
        shell: bash
        env:
          GITHUB_HEAD_SHA: ${{ needs.prepare.outputs.base_sha }}
          TRIGGER_REASON: ${{ needs.prepare.outputs.trigger_reason }}
        run: |
          # FR-020: Baseline store acceptance requires quality gate (mean >= 0.92).
          # MC-22: Quality gate enforced in BaselineStore.store() — rejects mean < 0.92.
          # MC-27: VersionKey path traversal prevention enforced in stats.py.
          echo "NO_REGRESSION confirmed — updating baseline store for ${{ matrix.agent }}"
          uv run python -m jerry.testing.baselines.store \
            --action store \
            --agent "${{ matrix.agent }}" \
            --results-file "tests/prompt-regression/results/full-${{ matrix.agent }}.json" \
            --report-file "tests/prompt-regression/results/report-full-${{ matrix.agent }}.json" \
            --commit-sha "${GITHUB_HEAD_SHA}" \
            --tier full \
            --reason "${TRIGGER_REASON}" \
            2>&1; STORE_EXIT=$?

          if [ $STORE_EXIT -ne 0 ]; then
            echo "::error::Baseline store update failed for ${{ matrix.agent }}"
            echo "::error::Baseline quality gate may have rejected the scores (mean < 0.92)"
            exit 1
          fi
          echo "Baseline stored successfully for ${{ matrix.agent }}"

      - name: Enforce regression gate (FR-018)
        shell: bash
        run: |
          VERDICT="${REGRESSION_VERDICT}"
          IS_MIGRATION="${{ needs.prepare.outputs.is_model_migration }}"

          echo "Full tier verdict: ${VERDICT} | Model migration: ${IS_MIGRATION}"

          case "${VERDICT}" in
            REGRESSION)
              echo "::error::REGRESSION detected in Full tier for '${{ matrix.agent }}'"
              echo "::error::N=30 Wilcoxon test confirms statistically significant quality degradation."
              if [ "${IS_MIGRATION}" = "true" ]; then
                echo "::error::Model migration FAILED — new model version shows regression vs. baseline."
              fi
              exit 1
              ;;
            MARGINAL)
              echo "::warning::MARGINAL result in Full tier for '${{ matrix.agent }}'"
              echo "::warning::Borderline significance (0.05 <= p < 0.10). Human review required."
              exit 0
              ;;
            NO_REGRESSION)
              echo "NO_REGRESSION in Full tier for '${{ matrix.agent }}'"
              if [ "${IS_MIGRATION}" = "true" ]; then
                echo "Model migration PASSED — no regression detected with new model version."
              fi
              exit 0
              ;;
            INSUFFICIENT_SAMPLES)
              # Should not occur in Full tier (N=30 >= 20), but handle defensively
              echo "::error::INSUFFICIENT_SAMPLES in Full tier for '${{ matrix.agent }}'"
              echo "::error::FR-014 violation: N=30 runs should satisfy N>=20 requirement."
              echo "::error::Check evaluation output for failed runs that reduced effective N."
              exit 1
              ;;
            *)
              echo "::error::Unknown verdict '${VERDICT}' for '${{ matrix.agent }}'"
              exit 1
              ;;
          esac

      - name: Stop cost monitor and check budget (MC-20)
        if: always()
        uses: ./.github/actions/cost-monitor
        with:
          agent_name: ${{ matrix.agent }}
          evaluation_tier: full
          cost_ceiling_usd: ${{ env.COST_CEILING_USD }}
          token_ceiling_thousands: ${{ env.TOKEN_CEILING_THOUSANDS }}
          phase: stop

      - name: Publish Full tier evaluation artifacts (90-day retention)
        if: always()
        uses: ./.github/actions/artifact-publish
        with:
          agent_name: ${{ matrix.agent }}
          evaluation_tier: full
          pr_number: "0"  # Full tier is not PR-triggered; use 0 for non-PR runs
          report_json: tests/prompt-regression/results/report-full-${{ matrix.agent }}.json
          report_markdown: tests/prompt-regression/results/report-full-${{ matrix.agent }}.md
          raw_results: tests/prompt-regression/results/full-${{ matrix.agent }}.json
          retention_days: "90"

  # ==========================================================================
  # Job 3: Aggregate final summary across all agents
  # ==========================================================================
  full-evaluation-summary:
    name: Full Evaluation Summary
    runs-on: ubuntu-latest
    needs: [prepare, full-regression]
    if: always()
    steps:
      - name: Build aggregated summary
        shell: bash
        run: |
          AGENTS_JSON='${{ needs.prepare.outputs.agents_json }}'
          TRIGGER="${{ needs.prepare.outputs.trigger_reason }}"
          MODEL="${{ needs.prepare.outputs.model_version }}"
          IS_MIGRATION="${{ needs.prepare.outputs.is_model_migration }}"
          OVERALL="${{ needs.full-regression.result }}"

          echo "============================================================"
          echo "PROMPT REGRESSION FULL EVALUATION SUMMARY"
          echo "============================================================"
          echo "Trigger: ${TRIGGER}"
          echo "Model:   ${MODEL}"
          echo "Mode:    $([ '${IS_MIGRATION}' = 'true' ] && echo 'Model Migration' || echo 'Standard')"
          echo "Agents:  ${AGENTS_JSON}"
          echo "Result:  ${OVERALL}"
          echo "Tier:    Full (N=30, Wilcoxon + Wilson + Bonferroni + MR-001-005)"
          echo "============================================================"

          if [ "${OVERALL}" = "failure" ]; then
            echo "REGRESSION DETECTED in Full tier evaluation."
            echo "Review per-agent artifacts for detailed statistical analysis."
            echo "Baseline store NOT updated (regressions block baseline refresh)."
            exit 1
          fi

          echo "All agents passed Full tier evaluation (N=30)."
          echo "Statistical analysis: Wilcoxon signed-rank, K=13 Bonferroni, Wilson CIs."
          echo "Artifacts with full reports available for 90 days."
