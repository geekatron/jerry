    approximately 8+ of 16 claims to be executable. Five claims at ~31% coverage correctly
    places the dimension at 0.89 (upper-mid of the 0.7-0.89 band), not 0.90+. The scoring
    rubric's "most claims supported" criterion is the binding constraint the projection did not
    apply with sufficient strictness.
