          SandboxedEnvironment security test.
      (C) Internal Consistency 0.94 -> 0.95: Requires adding drift_detected docstring to
          GenerateDocsResult AND closing the spec layout inconsistency.
    Most tractable single change: implement mode validation guard (option B). This is a 3-5
    line addition to handle() that eliminates the silent-mode gap. It would advance methodological
    rigor from 0.93 -> 0.94 (delta +0.002 to composite, reaching exactly 0.940).
    Second option: add drift_detected docstring to GenerateDocsResult + update spec File
