    8/16 executable claims (50%) satisfies "most" at the minimum level but does not satisfy
    "all claims." Therefore the maximum achievable score within the 0.7-0.89 band is 0.89
    (the band ceiling). The iteration 5 score of 0.89 was correctly placed at the upper
    position of this band. Adding 3 more tests (5->8 executable) improves coverage within
    the band but cannot raise the score above the band ceiling without crossing into "all claims"
    territory. To reach 0.90+, approximately 14-15 of 16 claims must have executable evidence
    (the "all claims" criterion). Currently 8 claims remain inspection-only.
  path_to_composite_threshold: >
    Gap: 0.002. Evidence Quality is bounded at 0.89 (rubric band ceiling). Therefore the
    path to 0.940 must come from a different dimension. Options (each contributes +0.002):
      (A) Completeness 0.94 -> 0.95: Requires update to spec File Structure section (src/docs/
          hexagonal layout) AND/OR substantive delivery of additional planned tests (say, 4-5
          more to reach 10 of 16 = 62.5%).
      (B) Methodological Rigor 0.93 -> 0.94: Requires implementing mode validation guard
          (3-line addition to handle(): if command.mode not in {"check","write",None}: return
