leniency_bias_check:
  each_dimension_scored_independently: true
  evidence_documented_for_each_score: true
  uncertain_scores_resolved_downward: true
  first_draft_calibration_considered: false  # iteration 4 of a C4 deliverable
  no_dimension_above_0_95_without_exceptional_evidence: true
  notes: >
    Anti-leniency scrutiny applied to four decision points:
    (1) Evidence Quality at 0.93 challenged: should it advance to 0.94 given the new guard
        test evidence? Re-examined: the happy-path gap (empty skills table) is the binding
        constraint. The iteration 3 scorer explicitly held at 0.93 with this gap open.
        Iteration 4 adds guard evidence but does not close the happy-path gap.
        Anti-leniency rule: "When uncertain between adjacent scores, choose the LOWER one."
        The gap is documented and real. Held at 0.93. This is the single score preventing
        the composite from reaching 0.94.
    (2) Methodological Rigor at 0.94 challenged: should it be 0.95 given guard is implemented?
        Re-examined: The unit test uses /nonexistent/templates/dir, not the CWD-mismatch
        scenario. No subdirectory smoke test exists. Happy-path rendering unexercised.
        These residual limitations are documented. 0.95 would require no residual limitations
        per rubric calibration anchors (0.92 = Strong work with minor refinements needed;
        0.95 requires genuinely excellent with minimal gaps). Held at 0.94.
    (3) Internal Consistency at 0.94 challenged: could it advance to 0.95? FOI-2 still has
        prospective framing ("to be tracked under ST-002") which is a minor imprecision.
        Anti-leniency: 0.95 requires "essentially perfect" alignment. The FOI-2 prospective
        reference is an imprecision. Held at 0.94.
    (4) Composite progression check: +0.0085 from iteration 3 (+0.0150 from iter 2, +0.0480
        from iter 1). The 0.0085 delta is proportionate to the scope of changes (one major
        fix vs. four gap closures in iteration 3). Plateau detection threshold is delta < 0.01
        for 3 consecutive iterations. This iteration: 0.0085. Iteration 3: 0.0150. No plateau
        (both above threshold, and only 2 consecutive iterations). Anti-leniency: the composite
        of 0.9385 correctly reflects a deliverable that has resolved the primary methodological
        gap with one narrow evidence gap remaining.
    Source verification performed: jinja2_renderer.py lines 50-55 confirmed present in
    source file. test_phase1_evidence.py lines 372-377 confirmed present. This goes beyond
    normal scoring practice and provides high confidence in the evidence claims.

