      Defect preventing 0.95: The FOI-1 body at the end of the section reads
      "Test #17 of 17, all passing" — a frozen reference from iteration 4. With test #18
      added, the total is now 18. This is a stale count embedded in a section that was
      not updated when test #18 was added. It does not contradict the pytest output
