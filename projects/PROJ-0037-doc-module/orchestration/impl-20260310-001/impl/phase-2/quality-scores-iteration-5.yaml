  - priority: 1
    dimension: internal_consistency
    current: 0.94
    target: 0.95
    action: >
      Update the FOI-1 body reference "Test #17 of 17, all passing" to reflect the
      correct total (18 tests). The phrase was accurate at iteration 4 but was not
      updated when test #18 was added in iteration 5. A simple fix: change
      "Test #17 of 17" to "test_jinja2_renderer_rejects_missing_template_dir (see
      full pytest output above)" or update the count to "Test #17 of 18."
      This is a cosmetic fix requiring no code changes.

  - priority: 2
    dimension: traceability + actionability
    current: 0.94 + 0.94
    target: 0.95 + 0.95
    action: >
      Resolve FOI-2 prospective tracking to a concrete worktracker task ID. Create
      or reference the child task under ST-002 for -> Any return type resolution
      in create_docs_generator(). Update FOI-2 tracking line to "Tracked as
      ST-002/task-NNN." This closes the one remaining prospective reference and
      makes the traceability and actionability chains fully concrete.

  - priority: 3
    dimension: methodological_rigor
    current: 0.94
    target: 0.95
    action: >
      Strengthen the guard unit test (test #17) to exercise the actual production
      failure scenario. Use tempfile and os.chdir() to navigate into a subdirectory,
      then construct Jinja2Renderer with the relative path ".context/templates/docs".
      Assert FileNotFoundError is raised. This confirms the guard fires on the exact
      CWD-mismatch scenario identified by S-004 pre-mortem, not merely on a fully
      absent path. Restore original directory with os.chdir() in teardown.

# ============================================================
# LENIENCY BIAS CHECK
# ============================================================
leniency_bias_check:
  each_dimension_scored_independently: true
  evidence_documented_for_each_score: true
  uncertain_scores_resolved_downward: true
  first_draft_calibration_considered: false  # iteration 5 of a C4 deliverable
  no_dimension_above_0_95_without_exceptional_evidence: true
  notes: >
    Anti-leniency scrutiny applied to six decision points:
    (1) Completeness 0.94 -> 0.95 challenged: Is the advancement from 0.94 warranted?
        The iteration 4 scorer explicitly stated the happy-path gap was the binding
        constraint for Completeness. The gap is now closed. FOI-2 remains, but was
        not the binding constraint (it is design debt outside Phase 2 scope, deferred
        by deliberate decision). 0.95 is directly supported by the scoring logic that
        produced 0.94: close the binding gap, the score advances. Justified.
    (2) Evidence Quality 0.93 -> 0.95 challenged: Is 0.95 too aggressive (should it be 0.94)?
        The iteration 4 projection was explicitly "0.93 -> 0.95" for this exact test.
        The test matches the recommended design (option b from S-010) precisely. The
        use of real Jinja2Renderer with actual templates goes beyond the minimum — it
        provides integration-level evidence, not just unit-level. 0.95 not 0.94 is
        warranted because the evidence addresses the full claim (pipeline produces
        non-empty output) with stronger evidence than a pure mock-only test would.
        Anti-leniency: if uncertain between 0.94 and 0.95, choose lower. Am I uncertain?
        The iteration 4 projection was 0.95. The test matches the projection. The
        evidence is direct and credible. Not uncertain — 0.95 is justified.
    (3) Internal Consistency held at 0.94 not 0.95: The stale "Test #17 of 17" reference
        is a real, findable inconsistency in the document. It was introduced by the
        iteration 5 revision (adding test #18 without updating all references). Anti-leniency:
        0.95 requires no misalignments. There is a misalignment. Held at 0.94.
    (4) Methodological Rigor held at 0.94 not 0.95: The CWD-mismatch test gap is
        unchanged. The happy-path test closure does not address this gap. Anti-leniency:
        two residual gaps (CWD scenario and the note about happy-path rendering being
        mock-only) prevent 0.95. Held at 0.94.
    (5) Actionability and Traceability held at 0.94: FOI-2 prospective tracking is
        unchanged across all five iterations. This is a persistent minor limitation.
        Anti-leniency: 0.95 requires no prospective references. Held at 0.94.
    (6) Composite 0.9435 calibration check: Delta from iteration 4 is +0.0050. This
        is proportionate to the scope of change (one test closing one gap, advancing
        two dimensions). Prior deltas: +0.0715 total across iterations 1-4. The
        0.0050 delta is the smallest single-iteration advance, which is correct for
        a change that closed one narrow gap. No inflation detected. Composite is
        mathematically correct and properly calibrated.

