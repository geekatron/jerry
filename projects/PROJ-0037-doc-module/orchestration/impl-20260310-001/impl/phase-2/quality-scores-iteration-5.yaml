      Anti-leniency: 0.95 would require closing this gap or demonstrating equivalence.
      The gap is real and documented. Held at 0.94.

  evidence_quality:
    score: 0.95
    weight: 0.15
    weighted: 0.1425
    evidence: >
      Advancement from 0.93 to 0.95 justified. This was the binding dimension across
      iterations 3 and 4. The binding constraint was explicit: "functional correctness
      of the skills extraction pipeline (non-empty rendered output for valid data) remains
