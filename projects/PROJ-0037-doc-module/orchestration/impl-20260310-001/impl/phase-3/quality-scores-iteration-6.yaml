detailed_dimension_analysis:

  completeness:
    score: 0.88
    evidence: |
      POSITIVE:
      - eng-qa-report: complete pre/post coverage breakdown (66% → 100%), per-module gap analysis
        with specific line number ranges, OWASP test category mapping, L0/L1/L2 structure.
      - security-review: all 5 mitigations (M-1 through M-5) verified with file:line citations,
        all 4 hexagonal constraints (H-07, H-10, H-11, H-33), OWASP mapping, NIST CSF mapping,
        residual risk register with 2 entries (RR-1, RR-2).
      - attack-surface-report: all 8 findings present (V1, V2, V3, V4, F5, F6, F7, F8),
        L0/L1/L2 structure, hardening backlog with priority ordering.
      - gate-disposition: cross-reference table now has 10 rows covering all attack-surface
        findings. Evidence summary correctly states "V1, V4, F6" (not the erroneous F8 from
        iteration 5). F7 and F8 (INFO) rows added per iteration 6 fix.
    gaps: |
      1. Disposition table scope inconsistency: section header says "Accept/defer/block per
         finding above LOW" but the table includes LOW findings RR-1 and RR-2 while omitting
         LOW findings F6, V1, and V4. This creates incomplete coverage for LOW findings in the
         disposition table — a reader cannot determine whether F6/V1/V4 were evaluated for
         disposition or simply omitted.
      2. V1-rec and V4-rec sub-findings appear in the cross-reference table without their own
         finding IDs, making forward traceability from attack-surface recommendations to
         disposition table impossible (they have no disposition row).
    improvement_path: |
      Either: (a) add a comment to the disposition table explaining that LOW findings from
      attack-surface are covered by the evidence summary note, and keep only the security-review
      LOWs (RR-1, RR-2) in the table; OR (b) add rows for F6, V1, V4 to make coverage complete.
      Assign finding IDs to V1-rec and V4-rec (e.g., F9, F10) if they need disposition tracking.

  internal_consistency:
    score: 0.91
    evidence: |
      CONSISTENT across all 4 documents:
      - 51 tests, all passing: eng-qa L0 summary + gate-disposition evidence summary.
      - 100% line coverage (323/323 statements): eng-qa post-addition table + gate-disposition.
      - 99% branch coverage (67/68): eng-qa L2 weaknesses + gate-disposition.
      - Missed branch: generate_docs_command_handler.py:294→299: eng-qa + gate-disposition agree.
      - 5 STRIDE mitigations COMPLIANT: security-review L0 + gate-disposition verdict.
      - 4 hexagonal constraints COMPLIANT: security-review L0 + gate-disposition verdict.
      - Jinja2 pin: pyproject.toml:40 = "jinja2>=3.1.6,<4.0": security-review M-4 + attack-surface
        Vector 2 + gate-disposition open findings all agree.
      - Severity counts (0 CRITICAL, 1 HIGH RESOLVED, 2 MEDIUM, 5 LOW, 2 INFO): gate-disposition
        evidence summary correctly reconciles attack-surface (3 LOW: V1, V4, F6) + security-review
        (2 LOW: RR-1, RR-2) = 5 LOW total.
      ITERATION 6 FIX VERIFIED: Evidence summary note now reads "V1, V4, F6 from attack-surface"
      (previously incorrectly said "V1, V4, F8").
    gaps: |
      PRE-EXISTING (not introduced by iteration 6):
      - V2 severity in cross-reference table: "INFO (current)" does not match the attack-surface
        L0 summary which shows "~~HIGH~~ LOW (RESOLVED)". The cross-reference table appears to
        reflect the post-resolution advisory state while the attack-surface reflects the full
        lifecycle. Both are technically defensible, but a reader comparing the two will see
        a severity disagreement for V2.
    improvement_path: |
      Align V2 severity in cross-reference table to "LOW (RESOLVED)" matching attack-surface L2
      residual risk summary table, and add a parenthetical noting the post-resolution state,
      e.g., "LOW (RESOLVED — patched version pinned)".

  methodological_rigor:
    score: 0.91
    evidence: |
      - eng-qa uses structured per-module gap analysis: each module gets its own before/after
        table with line numbers, branch descriptions, and test names. Security notes added
        to explain the defensive rationale for each branch. OWASP category mapping provided.
      - security-review uses formal STRIDE mitigation verification: each mitigation has a
        spec-vs-implementation comparison table; M-2 has a 4-row exact-match table. Import
        dependency matrix for H-07 compliance. H-10 per-file class count table.
      - attack-surface uses per-vector bypass feasibility assessment with specific bypass
        attempts (uppercase JAVASCRIPT:, percent-encoded colon, multi-line scalar). ATT&CK
        technique mappings. Priority-ordered hardening backlog with effort estimates.
      - gate-disposition provides explicit cross-report reconciliation for the Jinja2 severity
        divergence, distinguishing current-state risk (LOW) from structural forward risk (HIGH
        pre-hardening). M-5 name pattern discrepancy addressed with rationale.
    gaps: |
      - eng-qa does not document which specific branch in the compound boolean condition
        `if begin_marker not in readme_content or end_marker not in readme_content` is the
        missed 1/68 branch — the report says the missed branch is the OSError catch at
        generate_docs_command_handler.py:294→299, but also mentions the compound condition
        in _check_drift as a candidate. Gate-disposition confirms the missed branch is
        294→299. Minor documentation ambiguity in eng-qa L2 weakness #1.
    improvement_path: |
      Clarify eng-qa L2 weakness #1: state definitively that the compound boolean in _check_drift
      IS covered (both branches exercised) and the single missed branch IS ONLY the OSError catch
      at 294→299. This removes the ambiguity introduced by listing both as candidates.

  evidence_quality:
    score: 0.88
    evidence: |
      STRONG:
      - security-review cites specific file:line for every control: skill_extractor.py:34 for
        _HTML_TAG_PATTERN; lines 38-40 for _UNSAFE_LINK_PATTERN; pyproject.toml:40 for M-4;
        generate_docs_command_handler.py:281-287 for M-3. Regex patterns reproduced verbatim.
      - attack-surface reproduces the full subprocess.run() call block and _UNSAFE_LINK_PATTERN
        regex. Bypass attempts are specific (uppercase JAVASCRIPT:, percent-encoded colon).
      - eng-qa provides before/after line numbers: e.g., lines 292-299 for cleanup OSError path.
      - gate-disposition iteration 6 improvement: V3 row now cites
        generate_docs_command_handler.py:97-108 and test_path_traversal_rejected.
        RR-2 row now cites skill_extractor.py:143-146.
    gaps: |
      1. F5 disposition row: cites source report ("red-vuln (attack-surface-report.md, Finding 5)")
         but does not propagate the file:line from the source (attack-surface cites
         generate_docs_command_handler.py:142-150 as the specific location). The disposition
         rationale discusses ".context/templates/docs/" but not the code line where the
         unsanitized YAML enters the template context.
      2. V2 disposition row: cites "pyproject.toml:40" inline in the value text, which is adequate
         but formatted differently from the file:line citation style used in V3 and RR-2.
    improvement_path: |
      Add `generate_docs_command_handler.py:142-150` to the F5 disposition row to match the
      evidence quality of V3 and RR-2. Standardize the pyproject.toml:40 citation in V2 to
      the same format as other rows.

  actionability:
    score: 0.90
    evidence: |
      - Hardening backlog: 7 items with priority numbers, target files, and effort estimates
        ranging from "5 min" to "1 hr". Item 1 marked DONE. Items 2-7 have specific code changes
        described (e.g., "sanitized.replace('\\n', ' ').replace('\\r', ' ')" for item 3;
