  # Pipeline artifact path pattern
  # {pipeline_alias} resolved from pipelines.{id}.short_alias
  # {phase_id} is the phase directory (e.g., "phase-1")
  # {agent_id} provides agent-level isolation
  pipeline: "{base}{pipeline_alias}/{phase_id}/{agent_id}/"

  # Cross-pollination barrier path pattern
  # {barrier_id} is the barrier identifier (e.g., "barrier-1")
  # {direction} is "eng-to-red" or "red-to-eng"
  barrier: "{base}cross-pollination/{barrier_id}/{direction}/"

  # Skill output path (NOT orchestration artifacts — these are the deliverables)
  skill_output: "skills/nuclear-sop/"

