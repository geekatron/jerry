# =============================================================================
# QUALITY CONFIGURATION
# =============================================================================
quality:
  threshold: 0.93                # All gates: C3 elevated threshold (upgraded from 0.92 in v1.0)
  criticality: "C3"              # Significant — new skill, 16+ files, API surface change, routing registration
  scoring_mechanism: "S-014"     # LLM-as-Judge (primary); tournament mode at barriers
  # RR-03: Strategy count clarification — 6 C3 required strategies plus S-003 per H-16 = 7 total applied
  # C3 required set (6): S-007, S-002, S-014, S-004, S-012, S-013
  # H-16 ordering rule adds S-003 (Steelman) BEFORE S-002 at every critique cycle
  # Total strategies applied at every gate: 7
  strategy_count_total: 7
  strategy_count_c3_required: 6
  required_strategies:           # C3 required set per quality-enforcement.md — ALL run at EVERY gate
    - "S-007"   # Constitutional AI Critique
    - "S-002"   # Devil's Advocate
    - "S-014"   # LLM-as-Judge
    - "S-004"   # Pre-Mortem Analysis
    - "S-012"   # FMEA
    - "S-013"   # Inversion Technique
  h16_prepend:                   # Applied before S-002 per H-16 — not a "required strategy" per spec but always applied
    - "S-003"   # Steelman (MUST precede S-002 per H-16)
  optional_strategies:           # C3 optional set per quality-enforcement.md
    - "S-001"   # Red Team Analysis
    - "S-010"   # Self-Refine
    - "S-011"   # Chain-of-Verification
  h16_enforcement:
    rule: "S-003 (Steelman) MUST precede S-002 (Devil's Advocate) at every critique cycle"
    source: "H-16 (quality-enforcement.md)"
  barrier_review_mode: "tournament"  # 7 strategies (6 C3 required + S-003 per H-16) run against each handoff document (RR-03)
  scoring_dimensions:
    completeness: 0.20
    internal_consistency: 0.20
    methodological_rigor: 0.20
    evidence_quality: 0.15
    actionability: 0.15
    traceability: 0.10
  phase_scores: {}        # Populated by orch-tracker as phases complete
  barrier_scores: {}      # Populated by orch-tracker as barriers complete
  workflow_quality: {}    # Populated by orch-tracker on completion
  min_iterations: 3  # H-14: minimum 3 creator-critic-revision cycles REQUIRED (RR-07)
  max_iterations: 5  # RT-M-010 C3 ceiling

  # RR-04: CDR disposition taxonomy — required for QG-V3 open item adjudication
  cdr_disposition_taxonomy:
    RESOLVED: "Requirement now satisfied with evidence; trace evidence to specific verification method result"
    ACCEPTED_RISK: "Risk accepted with documented rationale and risk owner; not a defect, a conscious decision"
    WAIVED: "Requirement acknowledged as inapplicable to LLM-based implementation; rationale documented"
    ESCALATED: "Unresolvable by nse-reviewer-001; escalated to user per H-31 with full context for user decision"
    OPEN: "NOT a valid exit state — no open item may remain OPEN at V&V Phase 3 exit"

  # RR-05: LLM behavioral verification method vocabulary — required for QG-V2 verification method definitions
  llm_verification_vocabulary:
    BEHAVIORAL_SAMPLE: "Execute adversarial test scenario; document STAR agent output against expected outcome"
    TRACE_INSPECTION: "Read PROCEDURE_STATE.yaml execution log; verify correct field population for the tested step"
    METRIC_REFERENCE: "Cite specific PM-01 through PM-07 metric result from QG-E4 test harness; link metric value to pass/fail criterion"
    STRUCTURAL_ANALYSIS: "Read agent definition file (.md + .governance.yaml); verify behavioral rule encoding and forbidden_actions presence"

  auto_escalation:
    AE_003: "Implements ADR-001 (nuclear-sop-research-20260319-001/ps/phase-3) — auto-C3 minimum confirmed"
    AE_002_constraint: "nuclear-sop-behavior-rules.md MUST be placed at skills/nuclear-sop/rules/ NOT .context/rules/ — AE-002 would trigger auto-C3 on all subsequent sessions if placed in .context/rules/ (RR-07: moved from Criticality Assessment to Execution Constraints)"

