  id_format: "semantic-date-seq"  # Format: {purpose}-{YYYYMMDD}-{NNN}

  patterns:
    - SEQUENTIAL              # Phases execute in order
    - CHECKPOINT              # Recovery points after each phase+gate pair

  constraints:
    max_agent_nesting: 1          # P-003: Single nesting level
    file_persistence: true        # P-002: All state to filesystem
    user_authority: true          # P-020: User approves gates
