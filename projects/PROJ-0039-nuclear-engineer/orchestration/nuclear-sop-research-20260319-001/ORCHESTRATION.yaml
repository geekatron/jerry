    max_barrier_retries: 0        # No barriers (single pipeline)
    max_quality_gate_iterations: 3  # H-14 minimum; RT-M-010 C3 ceiling
    checkpoint_frequency: "PHASE_AND_GATE"

# =============================================================================
# PATH CONFIGURATION (WI-SAO-021)
# =============================================================================
# All paths are dynamically constructed using workflow and pipeline identifiers.
# No hardcoded pipeline names.
