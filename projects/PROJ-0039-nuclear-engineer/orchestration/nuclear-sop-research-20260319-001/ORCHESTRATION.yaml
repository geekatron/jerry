  base: "projects/PROJ-0039-nuclear-engineer/orchestration/nuclear-sop-research-20260319-001/"

  # Pipeline artifact path pattern
  # {pipeline_alias} derived from pipelines.ps.short_alias = "ps"
  # {phase_id} is the phase directory (e.g., "phase-1")
  # {agent_id} provides agent-level isolation
  pipeline: "{base}{pipeline_alias}/{phase_id}/{agent_id}/"

  # No cross-pollination barriers for single-pipeline Pattern 2 workflow
  # barrier: "{base}cross-pollination/{barrier_id}/{direction}/"

  # Examples (with workflow.id = "nuclear-sop-research-20260319-001"):
  # Phase 1: projects/PROJ-0039-nuclear-engineer/orchestration/nuclear-sop-research-20260319-001/ps/phase-1/ps-researcher-001/
