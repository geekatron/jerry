# =============================================================================
# CONSENSUS PANEL EXTENSION
# =============================================================================
consensus_panel:
  enabled: true
  phase_id: "phase-1-draft"
  platform: "windows-gitbash"
  parallel_supported: true

  cli_availability:
    claude: "unavailable"    # T-002: CLAUDECODE=1 nested session detected
    codex:  "cli"            # codex exec --full-auto, gpt-4o
    gemini: "cli"            # gemini --yolo, gemini-2.5-pro

  nested_session_detected: true   # CLAUDECODE=1 at preflight
  workers_available: 2
  user_confirmed_degraded: true   # User chose "Proceed with 2-model panel"
  timeout_seconds: 600

  cli_flags_used:
    codex:  "codex exec --full-auto -m gpt-4o"    # NOTE: --yolo flag does not exist; --full-auto is correct for v0.115.0
    gemini: "gemini --yolo --model gemini-2.5-pro --prompt"

  api_fallback_used:
    claude: false
    codex:  false
    gemini: false

  artifacts:
    intent:           "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-intent.md"
    codex_draft:      "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-codex-draft.md"
    gemini_draft:     "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-gemini-draft.md"
    codex_critique:   "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-codex-critique.md"
    gemini_critique:  "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-gemini-critique.md"
    synthesis:        "orchestration/consensus-panel-20260316-001/consensus/phase-1-draft-synthesis.md"

  exit_codes:
    claude_draft:   -1       # -1 = not launched (T-002 blocked)
    codex_draft:     0       # success (second attempt; first attempt exit=2 due to --yolo flag conflict)
    gemini_draft:    0       # success
    codex_critique:  0
    gemini_critique: 0

  status:
    preflight:      "COMPLETE"
    draft_phase:    "COMPLETE"      # 2/2 workers produced output
    critique_phase: "COMPLETE"      # 2/2 workers produced output
    synthesis:      "COMPLETE"

  results:
    consensus_points:
      - "CP-1: Pure Python CLI (uv run) is the correct implementation form"
      - "CP-2: Five-component architecture (Pre-flight, Worker Launcher, Wait/Timeout, Output Verifier, Synthesis Handoff)"
      - "CP-3: subprocess.Popen as the launch primitive (not Bash &)"
      - "CP-4: Output verification must check existence AND non-emptiness"
      - "CP-5: stdout/stderr must be redirected to per-model log files"
      - "CP-6: SIGTERM -> wait -> SIGKILL escalation (never immediate SIGKILL)"
      - "CP-7: CLAUDECODE=1 nested session guard belongs in pre-flight module"
      - "CP-8: ORCHESTRATION.yaml writes must use atomic rename pattern"
    divergence_points:
      - "DP-1: Depth of State Manager specification (implicit vs. explicit component)"
      - "DP-2: Pre-flight conformance check detail (--version probe, version parsing)"
      - "DP-3: Process group management for orphan/zombie prevention (os.setsid on Windows)"
      - "DP-4: Worker configuration strategy and schema"
    panel_gaps:
      - "PG-1: Claude CLI output format and behavioral specifics (Claude absent)"
      - "PG-2: asyncio-based alternative not evaluated"
      - "PG-3: Jerry Framework integration depth (standalone vs. skill tradeoffs)"
      - "PG-4: Windows-specific subprocess behavior under Git Bash"
    implementation_findings:
      - "T-004: Hybrid Bash/Python non-functional — adopt pure Python"
      - "T-005: Output verification multi-step: existence + size + optional completion marker"
      - "T-006: Worker stdout/stderr must redirect to named log files"
      - "T-007: SIGTERM -> grace period -> SIGKILL required sequence"
      - "T-008: Pre-flight conformance check is mandatory"
      - "T-009: State Manager must be explicit with atomic write semantics"
      - "T-010: Worker configuration must be externalized to structured config file"
      - "T-011: Process group management strategy must be defined per platform"

  quality_score:
    mechanism: "S-014"
    composite: 0.94
    threshold: 0.92
    verdict: "PASS"

