    v1.2: Escalated from C2 to C3. Three drivers: (1) OSS trust concern —
    governance YAML behavioral specs are visible to contributors and warrant
    higher scrutiny; (2) AC-3 is only partially satisfied — the agent invocation
    framework gap was not visible in v1.1; (3) 6 evidence gates add verification
    scope that aligns with C3 rigor. The v1.1 mechanical-edit argument is
    superseded. C3 adds required strategies S-004, S-012, S-013.
