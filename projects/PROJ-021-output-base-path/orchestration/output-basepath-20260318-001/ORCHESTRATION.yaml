        severity: "HIGH"
        resolution_required: "Add Path.resolve() + relative_to() check in get_project_data_path() — ~8 lines in bootstrap.py"
      - id: "SRR-FIND-004"
        description: "AC-3c runtime interpolation deferred — GitHub Issue required for follow-up tracking"
        category: "documentation"
        severity: "INFO"
        resolution_required: "Create GitHub Issue for AC-3c implementation before SRR closure"

