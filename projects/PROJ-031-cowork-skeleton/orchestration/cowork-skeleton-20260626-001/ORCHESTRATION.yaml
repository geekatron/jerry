risks:
  - id: "R-001"
    description: "CoWork counts local working-tree files (not clean clone) — .venv/ inflates count, projects/ removal insufficient"
    likelihood: "Medium"
    impact: "Critical"
    mitigation: "Phase 1: add verification step — reproduce error on clean clone vs dev checkout"
  - id: "R-002"
    description: "skills/transcript/test_data/ ~908 KB blobs survive — clone weight concern"
    likelihood: "Low"
    impact: "Low-Medium"
    mitigation: "Phase 3: optional flag in generate-cowork-skeleton.sh to strip test_data/"
  - id: "R-003"
    description: "Force-push overwrites manual commits on cowork-skeleton branch"
    likelihood: "Low"
    impact: "Medium"
    mitigation: "CI-owned branch documentation in workflow header + stub README warning"
  - id: "R-004"
    description: "PAT scope broader than required — token exfiltration risk"
    likelihood: "Medium"
    impact: "High"
    mitigation: "Phase 2 STRIDE + Phase 6: SHA-pin Actions, minimum PAT scope, environment protection"
  - id: "R-005"
    description: "CI loop: cowork-skeleton.yml inadvertently triggers itself or upstream workflows"
    likelihood: "Low"
    impact: "High"
    mitigation: "Phase 3+6: trigger restricted to tags/v* only; skeleton push is a branch not a tag; formal loop-safety argument required"
  - id: "R-006"
    description: "Branch protection on cowork-skeleton blocks force-push from CI"
    likelihood: "Low-Medium"
    impact: "Medium"
    mitigation: "Phase 6: document and implement branch-protection exemption; mirror gh-pages pattern"
  - id: "R-007"
    description: "Supply-chain: compromised CI injects malicious content into cowork-skeleton"
    likelihood: "Low"
    impact: "Critical"
    mitigation: "Phase 2 STRIDE + Phase 6: SHA-pin, SLSA provenance, branch protection + required CI check, integrity audit"

