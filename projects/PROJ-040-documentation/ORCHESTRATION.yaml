      source alongside UX and PM stream outputs.

    status: "PENDING"
    current_phase: "1a"
    total_phases: 1
    progress_percent: 0

    phases:
      # ---- PHASE 1a: Research Independent Discovery ----
      - id: "1a"
        name: "Independent Discovery"
        execution_mode: "SEQUENTIAL_DELEGATION"
        status: "PENDING"

        agents:
          - agent_id: "ps-researcher"
            feature_id: "FEAT-040-056"
            title: "OSS docs best-practices research"
            phase: "1a"
            status: "pending"
            depends_on: []
            artifact_path: "projects/PROJ-040-documentation/work/EPIC-040-001/research/FEAT-040-056/ps-researcher-output.md"
            handoff_id: "HO-W1-009"
            quality_threshold: 0.92
            iteration_ceiling: 7
            quality_score: null
            score_history: []
            key_findings: []
            github_issue_url: null
            criticality: "C3"

# NOTE: Synthesis (FEAT-040-057 / ps-synthesizer) is NOT a pipeline —
# it is the Phase 3 convergence gate. See barriers and execution_queue.

# =============================================================================
# BARRIERS (QUALITY GATES)
# =============================================================================
barriers:

  - barrier_id: "QG-1A"
    name: "Phase 1a Completion Gate"
    phase: "1a"
    purpose: >
      All 9 Phase 1a features must reach complete state with C3 >= 0.92 before
      Phase 1b can begin. Protects Phase 1b enrichment inputs from missing upstream data.
    triggering_condition: "All 9 Phase 1a dispatches reach state=complete"
    features_required:
      - FEAT-040-001   # ux-jtbd-analyst (★ DAG root)
      - FEAT-040-002   # ux-heart-analyst (provisional pass)
      - FEAT-040-004   # ux-heuristic-evaluator
      - FEAT-040-005   # ux-inclusive-evaluator
      - FEAT-040-006   # ux-behavior-diagnostician
      - FEAT-040-007   # ux-lean-ux-facilitator
      - FEAT-040-008   # ux-atomic-architect
      - FEAT-040-055   # pm-competitive-analyst
      - FEAT-040-056   # ps-researcher
    threshold: 0.92
    threshold_per: "feature"
    criticality: "C3"
    blocking_behavior: >
      If any feature is blocked: pause Wave 1, escalate to user per H-31 and H-36.
      SPECIAL CASE — FEAT-040-001 blocked: Wave 1 pauses; DOES NOT auto-proceed-with-gap
      (FEAT-040-001 is DAG root; Phase 1b features require JTBD enrichment inputs).
      Time-box: 5 business days → escalate to "Wave 1 suspended — awaiting human decision".
      Non-root feature blocked: user chooses proceed-with-gap or wait; non-root features do
      not prevent Phase 1b from starting.
    strategies:
      per_feature:
        required: ["S-007", "S-002", "S-014", "S-004", "S-012", "S-013"]   # C3 required set; source: adversarial.strategy_sets.C3_per_feature
        optional: ["S-001", "S-003", "S-010", "S-011"]
        source: "adversarial.strategy_sets.C3_per_feature"
      ordering_constraint: "S-003 MUST precede S-002 if both run (H-16)"
    on_pass: >
      Write phase-1a-checkpoint.yaml. Batch-update WORKTRACKER.md.
      Retrieve XP signals (FEAT-040-001 and FEAT-040-055 key_findings).
      Unblock Phase 1b. Proceed to Phase 1b dispatch.
    on_fail: "Per-feature circuit breaker + user escalation per Failure Handling section"
    status: "PENDING"
    gate_result: null
    completed_at: null

  - barrier_id: "QG-1B"
    name: "Phase 1b Completion Gate"
    phase: "1b"
    purpose: >
      All 4 Phase 1b features (FEAT-040-003, FEAT-040-002 enriched, FEAT-040-053,
      FEAT-040-054) must reach complete state with C3 >= 0.92 before Phase 2 begins.
    triggering_condition: "All 4 Phase 1b features reach state=complete"
    features_required:
      - FEAT-040-003   # ux-kano-analyst (authoritative)
      - FEAT-040-002   # ux-heart-analyst (enriched/authoritative pass)
      - FEAT-040-053   # pm-customer-insight
      - FEAT-040-054   # pm-market-strategist
    threshold: 0.92
    threshold_per: "feature"
    criticality: "C3"
    blocking_behavior: >
      All Phase 1b features are enrichment-dependent on Phase 1a outputs; none are hard deps
      for each other. If any Phase 1b feature is blocked: orchestrator notes which synthesis
      inputs will be partial and flags in synthesis handoff. Proceed to Phase 2 with gap noted.
    special_case_FEAT_040_002_blocked: >
      If FEAT-040-002 (HEART enriched/authoritative Phase 1b) is blocked: synthesis uses the
      Phase 1a provisional artifact (ux-heart-analyst-provisional-output.md) as fallback.
      Synthesizer handoff (HO-W1-013) substitutes the provisional path for the authoritative
      path. Provisional output must be flagged as partial input in synthesis scope-limitations
      section. See barriers.QG-3.synthesis_inputs FEAT-040-002 fallback_artifact entry.
    strategies:
      per_feature:
        required: ["S-007", "S-002", "S-014", "S-004", "S-012", "S-013"]   # C3 required set; source: adversarial.strategy_sets.C3_per_feature
        optional: ["S-001", "S-003", "S-010", "S-011"]
        source: "adversarial.strategy_sets.C3_per_feature"
      ordering_constraint: "S-003 MUST precede S-002 if both run (H-16)"
    on_pass: >
      Write phase-1b-checkpoint.yaml. Batch-update WORKTRACKER.md.
      Check AE-006 context fill: if >= 0.80 delegate QG-2 to fresh-context ps-critic;
      if < 0.80 orchestrator-executed. Proceed to Phase 2.
    on_fail: "Per-feature circuit breaker + gap-noting + user escalation if required"
    status: "PENDING"
    gate_result: null
    completed_at: null

  - barrier_id: "QG-2"
    name: "Cross-Pollination Consistency Check"
    phase: "2"
    purpose: >
      Orchestrator-executed inter-stream consistency check. Verifies zero hard conflicts
      between UX and PM stream findings that would produce contradictory synthesis
      recommendations. Hard conflicts block QG-2. Soft conflicts pass with synthesis notes.
    triggering_condition: "QG-1B passes"
    features_consulted:
      - FEAT-040-004   # heuristic findings (XP-05)
      - FEAT-040-005   # WCAG findings (XP-05)
      - FEAT-040-006   # B=MAP barriers (XP-06)
      - FEAT-040-007   # Lean UX hypotheses (XP-06)
      - FEAT-040-053   # Personas (actor segment alignment with JTBD)
      - FEAT-040-054   # Positioning (user-segment alignment with JTBD)
    hard_conflict_definition: >
      A conflict is HARD if all three conditions hold:
      (a) same surface element is referenced;
      (b) severity or recommendation divergence is >= 2 levels (e.g., Critical vs. Low);
      (c) accepting both would require contradictory documentation recommendations.
    hard_conflict_threshold_derivation: >
      Threshold derivation: a 2-level divergence on the 4-level severity scale
      (Cosmetic/Minor/Major/Critical) represents disagreement across the threshold that
      divides acceptable-for-release from release-blocking (Minor↔Major is the key boundary).
      1-level divergence is normal inter-rater variance; 2-level is a material disagreement
      requiring reconciliation. Source: internal heuristic; formalize in trade study if
      QG-2 false-positive rate exceeds 15% during execution.
    threshold: "zero_hard_conflicts"
    blocking_behavior: >
      Zero hard conflicts required before proceeding to QG-2.5.
      If hard conflict found: orchestrator documents conflict, presents to user with specific
      feature pairs and conflicting claims. User chooses: (a) instruct synthesizer to note
      conflict and recommend resolution, (b) request revision of conflicting feature,
      (c) accept competing perspectives and note in synthesis.
      AE-006 note: if context fill >= 0.80 at Phase 1b exit, delegate QG-2 to fresh-context
      ps-critic (P-003 compliant single hop: orchestrator → ps-critic).
    strategies:
      consistency_check: ["S-010"]   # self-review of key_findings; orchestrator-executed
    on_pass: "Write phase-2-xp-checkpoint.yaml. Proceed to QG-2.5."
    on_fail: "User resolution required; apply decision; write updated checkpoint; proceed"
    status: "PENDING"
    gate_result: null
    completed_at: null

  - barrier_id: "QG-2.5"
    name: "Source-Fidelity Gate"
    phase: "2"
    purpose: >
      ps-critic reads all 12 source artifacts + state file key_findings before Discovery
      Synthesis runs. Separates quality assessment (C4 tournament) from accuracy verification.
      Ensures Discovery Synthesis — the single point of failure for Waves 2-4 — does not
      silently omit or distort upstream findings. (Source: IN-001 finding, iter-1 tournament)
    triggering_condition: "QG-2 passes (zero hard conflicts)"
    handoff_id: "HO-W1-013a"
    agent: "ps-critic"
    first_pass_note: >
      On first pass (before ps-synthesizer has been delegated): ps-critic performs a
      source-readability pre-check — confirms all 12 artifacts are readable and state-file
      key_findings[] are extractable. No synthesis document required at this stage.
    revision_pass_note: >
      On revision passes (after ps-synthesizer has returned a synthesis draft): also include
      current synthesis artifact path; ps-critic performs full fidelity assessment.
    key_finding_definition: >
      A key finding is: (a) each bullet in feature's key_findings[] field in its state file,
      AND (b) the feature's primary named deliverable (e.g., JTBD job statements table,
      Kano classification matrix, HEART goal-signal-metric triples, B=MAP barrier list).
      Orchestrator includes all 12 feature state file paths in HO-W1-013a so ps-critic can
      read key_findings[] directly.
    fidelity_report_path: "projects/PROJ-040-documentation/orchestration/reviews/qg-25-source-fidelity-report.md"
    pass_condition: >
      All state-file key_findings bullets either appear in synthesis OR are explicitly listed
      in synthesis's "excluded findings" section with rationale. All primary named deliverables
      present at declared scope.
    fail_condition: >
      Any state-file key_findings bullet silently omitted without rationale, OR any primary
      named deliverable absent from synthesis.
    on_fail_protocol: >
      Orchestrator returns fidelity report to ps-synthesizer with revision package:
      (a) fidelity report path, (b) source artifact paths for flagged gaps from state files,
      (c) current synthesis artifact path. ps-synthesizer reads source artifacts directly
      and revises. Max 3 iterations before escalating to user with escalation package
      (fidelity reports from all iterations + missing/distorted findings + scope-reduction option).
    max_iterations: 3
    strategies:
      fidelity_check: ["S-010", "S-011"]   # self-review + chain-of-verification
    threshold: "PASS"   # binary: PASS or FAIL
    blocking_behavior: >
      QG-3 C4 tournament MUST NOT run until QG-2.5 PASSES. (Source: IN-001; P-022)
    on_pass: >
      Write phase-2-fidelity-checkpoint.yaml. Proceed to Phase 3 (ps-synthesizer delegation).
    on_fail: "Revision cycle per fail protocol above; max 3 iterations; then escalate"
    status: "PENDING"
    gate_result: null
    completed_at: null

  - barrier_id: "QG-3"
    name: "Wave 1 Exit Gate — Discovery Synthesis"
    phase: "3"
    purpose: >
      Discovery Synthesis (FEAT-040-057 / ps-synthesizer) must pass C4 adversarial tournament
      with composite score >= 0.95. This is the wave boundary gate. The synthesis artifact is
      the typed input for Waves 2, 3, and 4. It is irreversible: once waves proceed based on
      this synthesis, errors cascade to all downstream waves.
    triggering_condition: "QG-2.5 PASSES AND FEAT-040-057 ps-synthesizer returns artifact"
    features_required:
      - FEAT-040-057   # ps-synthesizer (Discovery Synthesis; consumes all 12 stream outputs)
    synthesis_inputs:   # all 12 stream feature artifacts
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-001/ux-jtbd-analyst-output.md"
      # FEAT-040-002 HEART: authoritative path (Phase 1b); fallback to provisional if Phase 1b blocked at QG-1B
      - feature_id: "FEAT-040-002"
        primary_artifact: "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-002/ux-heart-analyst-output.md"
        fallback_artifact: "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-002/ux-heart-analyst-provisional-output.md"
        fallback_condition: "Phase 1b HEART blocked at QG-1B (proceed-with-gap scenario)"
        fidelity_note: "Provisional output has lower confidence; synthesis must cite this in scope-limitations section"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-003/ux-kano-analyst-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-004/ux-heuristic-evaluator-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-005/ux-inclusive-evaluator-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-006/ux-behavior-diagnostician-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-007/ux-lean-ux-facilitator-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/ux/FEAT-040-008/ux-atomic-architect-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/pm/FEAT-040-053/pm-customer-insight-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/pm/FEAT-040-054/pm-market-strategist-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/pm/FEAT-040-055/pm-competitive-analyst-output.md"
      - "projects/PROJ-040-documentation/work/EPIC-040-001/research/FEAT-040-056/ps-researcher-output.md"
    synthesis_artifact: "projects/PROJ-040-documentation/work/EPIC-040-001/synthesis/discovery-synthesis.md"
    threshold: 0.95
    criticality: "C4"
    blocking_behavior: >
      Synthesis cannot proceed to wave exit without C4 >= 0.95 (or explicit human exception
      via SRP). If blocked after 10 iterations: mandatory human review required before Wave 2
      planning begins. Synthesize Review Package (SRP) assembled for human approver.
    tournament_protocol: >
      10 sequential direct delegations from main context (orchestrator → adv-executor, once per
      strategy). No chained delegation through adv-executor as coordinator. Main context retains
      control of all strategy orchestration. (Source: CC-001; H-01/P-003)
    strategies:
      required: ["S-001", "S-002", "S-003", "S-004", "S-007", "S-010", "S-011", "S-012", "S-013", "S-014"]
      optional: []   # no optional strategies at C4; all 10 required (source: SR-003, quality-enforcement.md)
      h16_enforced: true   # S-003 (steelman) MUST precede S-002 (devil's advocate)
      canonical_sequence: ["S-010", "S-003", "S-002", "S-007", "S-004", "S-012", "S-013", "S-011", "S-001", "S-014"]
    max_iterations: 10   # RT-M-010 C4 ceiling (agent-routing-standards.md)
    min_iterations: 3    # H-14
    on_pass: >
      Write wave-1-complete-checkpoint.yaml. Update WORKTRACKER.md: EPIC-040-001 → Complete;
      FEAT-040-057 → Complete. Record synthesis artifact path. Log Wave 1 complete.
      Typed input ready for Waves 2-4 planning.
    on_revise: >
      0.90-0.94 (REVISE band): revision cycle with full tournament feedback.
    on_fail: >
      < 0.90: significant rework; present to user.
      10-iteration ceiling: assemble SRP; present to human approver; halt Wave 2.
    escalation_path: >
      SRP includes: best synthesis artifact path, S-014 dimension scores across all iterations,
      critic findings from each strategy across all iterations, QG-2.5 fidelity report,
      proposal options: (a) approve at current score with exception, (b) scope-reduce and retry,
      (c) defer Wave 2-4 planning pending human revision.
    status: "PENDING"
    gate_result: null
    completed_at: null

# =============================================================================
# ADVERSARIAL STRATEGY CONFIGURATION
# =============================================================================
adversarial:
  # Source: quality-enforcement.md Strategy Catalog + wave-1-discovery-plan.md L2 Quality Section
  scoring_mechanism: "S-014"   # LLM-as-Judge, 6-dimension rubric

  strategy_sets:
    # Per-feature adversarial protocol (C3 features in Phase 1a and 1b)
    C3_per_feature:
      criticality: "C3"
      # C3 required = C2 required (S-007, S-002, S-014) + C3 additions (S-004, S-012, S-013)
      # Source: .context/rules/quality-enforcement.md — Criticality Levels table — C3 row
      required:
        - S-007   # Constitutional AI Critique  (required at C2+)
        - S-002   # Devil's Advocate            (required at C2+)
        - S-014   # LLM-as-Judge                (required at C2+)
        - S-004   # Pre-Mortem Analysis         (required at C3+)
        - S-012   # FMEA                        (required at C3+)
        - S-013   # Inversion Technique         (required at C3+)
      optional:
        - S-001   # Red Team Analysis
        - S-003   # Steelman Technique (MUST precede S-002 if both are run — H-16)
        - S-010   # Self-Refine
        - S-011   # Chain-of-Verification
      ordering_constraint: "S-003 MUST precede S-002 if both are run (H-16)"
      source: ".context/rules/quality-enforcement.md — Criticality Levels table — C3 row"
      threshold: 0.92
      max_iterations: 7    # RT-M-010
      min_iterations: 3    # H-14
      adv_scorer_output_path_template: "projects/PROJ-040-documentation/orchestration/reviews/{feature-id}-adv-review.md"

    # Wave-boundary synthesis tournament (C4 — QG-3)
    C4_synthesis:
      criticality: "C4"
      required: ["S-001", "S-002", "S-003", "S-004", "S-007", "S-010", "S-011", "S-012", "S-013", "S-014"]
      optional: []   # no optional at C4
      threshold: 0.95
      max_iterations: 10   # RT-M-010
      min_iterations: 3    # H-14
      h16_enforced: true
      canonical_sequence: ["S-010", "S-003", "S-002", "S-007", "S-004", "S-012", "S-013", "S-011", "S-001", "S-014"]
      invocation_protocol: >
        10 sequential direct delegations from main context per strategy.
        For each: pass Strategy ID, Template Path = .context/templates/adversarial/s-{NNN}-{slug}.md,
        Deliverable Path = synthesis artifact path from FEAT-040-057 state file.
        No adv-executor as coordinator. (Source: CC-001; CC2-002; H-01/P-003)
      tournament_artifacts_path: "projects/PROJ-040-documentation/orchestration/reviews/qg3-tournament/"

    # QG-2.5 source-fidelity strategies (ps-critic)
    C3_source_fidelity:
      gate: "QG-2.5"
      agent: "ps-critic"
      required: ["S-010", "S-011"]   # self-review + chain-of-verification
      threshold: "PASS"    # binary gate; no numeric composite
      max_iterations: 3    # plan section: QG-2.5 Source-Fidelity Gate Protocol

  quality:
    threshold_per_feature: 0.92          # H-13 compliant (C2+ minimum); quality-enforcement.md H-13
    threshold_synthesis: 0.95
    criticality: "C4"
    scoring_mechanism: "S-014"
    iteration_ceiling_per_feature: 7     # C3 ceiling per RT-M-010 (agent-routing-standards.md)
    iteration_ceiling_synthesis: 10      # C4 ceiling per RT-M-010
    all_strategies_in_workflow:    # informational — all 10 strategies used anywhere in Wave 1; NOT all required for every feature
      scope_note: "per-feature (C3) scope: see strategy_sets.C3_per_feature.required (6 strategies); synthesis (C4) scope: QG-3 full tournament (all 10)"
      catalog:
        - "S-007"    # constitutional compliance — C3 per-feature (required) + C4 synthesis (required)
        - "S-002"    # devil's advocate        — C3 per-feature (required) + C4 synthesis (required)
        - "S-014"    # LLM-as-Judge            — C3 per-feature (required) + C4 synthesis (required)
        - "S-004"    # pre-mortem              — C3 per-feature (required) + C4 synthesis (required)
        - "S-012"    # FMEA                    — C3 per-feature (required) + C4 synthesis (required)
        - "S-013"    # inversion               — C3 per-feature (required) + C4 synthesis (required)
        - "S-010"    # self-review             — C3 per-feature (optional) + C4 synthesis (required)
        - "S-001"    # red team                — C3 per-feature (optional) + C4 synthesis (required)
        - "S-003"    # steelman                — C3 per-feature (optional; MUST precede S-002 if run, H-16) + C4 synthesis (required)
        - "S-011"    # chain-of-verification   — C3 per-feature (optional) + C4 synthesis (required)
    full_tournament_at:
      - "QG-3"     # synthesis exit gate — all 10 strategies required at C4
    optional_strategies: []   # no optional strategies at C4; all 10 are required (source: SR-003)
    source_fidelity_gate: "QG-2.5"
    phase_scores: {}      # populated by orch-tracker during execution
    barrier_scores: {}    # populated by orch-tracker during execution
    workflow_quality: {}  # populated by orch-tracker (aggregate)

# =============================================================================
# EXECUTION QUEUE
# =============================================================================
execution_queue:
  current_phase: "1a"
  current_group: 1
  status: "READY_TO_DISPATCH"

  pre_wave_initialization:
    h32_github_issue_parity:
      note: >
        At step 0, verify active repo: gh repo view --json nameWithOwner.
        If nameWithOwner == "geekatron/jerry": verify/create GitHub Issues for all 13 features.
        Record GitHub Issue URL in each feature state file. (Source: CC-002; CC2-001; H-32)
      status: "pending"
    state_files_initialized: false   # set true when all 13 FEAT-040-NNN.yaml created with state=pending
    output_dirs_created: false        # set true after mkdir -p for all stream/synthesis/state/checkpoint dirs

  ready_to_dispatch:
    - feature_id: "FEAT-040-001"
      agent: "ux-jtbd-analyst"
      pipeline: "ux"
      phase: "1a"
      priority: "FIRST"
      rationale: >
        JTBD is the DAG root. If session compacts before all Phase 1a features complete,
        FEAT-040-001 completion protects Phase 1b from blockage. Dispatch first.

  pending_phase_1a:
    # Dispatch after FEAT-040-001 returns; no inter-feature deps; any order acceptable
    - feature_id: "FEAT-040-002"
      agent: "ux-heart-analyst"
      pipeline: "ux"
      phase: "1a"
      note: "provisional pass; include explicit JTBD-pending instruction in handoff"
    - feature_id: "FEAT-040-004"
      agent: "ux-heuristic-evaluator"
      pipeline: "ux"
      phase: "1a"
    - feature_id: "FEAT-040-005"
      agent: "ux-inclusive-evaluator"
      pipeline: "ux"
      phase: "1a"
    - feature_id: "FEAT-040-006"
      agent: "ux-behavior-diagnostician"
      pipeline: "ux"
      phase: "1a"
    - feature_id: "FEAT-040-007"
      agent: "ux-lean-ux-facilitator"
      pipeline: "ux"
      phase: "1a"
    - feature_id: "FEAT-040-008"
      agent: "ux-atomic-architect"
      pipeline: "ux"
      phase: "1a"
    - feature_id: "FEAT-040-055"
      agent: "pm-competitive-analyst"
      pipeline: "pm"
      phase: "1a"
    - feature_id: "FEAT-040-056"
      agent: "ps-researcher"
      pipeline: "research"
      phase: "1a"

  pending_phase_1b:
    # Blocked by QG-1A. Dispatch after QG-1A passes and XP signals retrieved.
    - feature_id: "FEAT-040-003"
      agent: "ux-kano-analyst"
      pipeline: "ux"
      phase: "1b"
      xp_enrichment: ["XP-01"]
      handoff_id: "HO-W1-010"
    - feature_id: "FEAT-040-002"
      agent: "ux-heart-analyst"
      pipeline: "ux"
      phase: "1b"
      pass_type: "enriched_authoritative"
      xp_enrichment: ["XP-01b"]
      handoff_id: "HO-W1-010b"
    - feature_id: "FEAT-040-053"
      agent: "pm-customer-insight"
      pipeline: "pm"
      phase: "1b"
      xp_enrichment: ["XP-02"]
      handoff_id: "HO-W1-011"
    - feature_id: "FEAT-040-054"
      agent: "pm-market-strategist"
      pipeline: "pm"
      phase: "1b"
      xp_enrichment: ["XP-03", "XP-04"]
      handoff_id: "HO-W1-012"

  pending_phase_2:
    - step: "QG-2"
      type: "consistency_check"
      executed_by: "orchestrator"
      note: "if context fill >= 0.80 at Phase 1b exit: delegate to fresh-context ps-critic"
    - step: "QG-2.5"
      type: "source_fidelity_gate"
      agent: "ps-critic"
      handoff_id: "HO-W1-013a"

  pending_phase_3:
