key_findings:
  - "All five HEART dimensions selected with full GSM tables. Provisional Adoption goal is 'first-skill invocation within target window' — pending JTBD enrichment (XP-01b) for Phase 1b validation. Getting-Started Completion Rate (Task Success / Adoption) is the single highest-impact metric (behavioral completion event PRIMARY, survey self-report FALLBACK-ONLY), grounded in triple-convergence evidence: B=MAP Major bottleneck (FEAT-040-006), F-010 Severity 3 missing Facilitator prompt, F-001 Severity 3 stale skills table."
  - "Skill Discovery Rate (Engagement) goal reframed (iter-3) to catalog-fraction framing — (distinct skill documentation pages visited / total registered skills) proportional to full catalog, post-remediation stable regardless of how many skills are visible at entry points. Metric count: 9 independent metrics + 2 diagnostic drill-downs. Time-to-First-Skill-Invocation requires identity bridge (account bridge or session-token correlation) to join web analytics to CLI telemetry — deferred to Phase 3 without bridge."
  - "Jerry Framework documentation is at Measurement Maturity Level 0. Phase 1b hard dependency gate: Phase 1b authoritative HEART pass CANNOT proceed until Phase 1 instrumentation confirmed live and collecting data for minimum 30 days. Owner: DevSecOps + Docs lead (per ORCHESTRATION.yaml). Baseline divergence contingency: if Getting-Started Completion Rate baseline >= 55% re-evaluate critical path; >= 70% initiate retrospective; Step 3 floor < 20% escalate to orchestrator."
  - "All thresholds are [REFERENCE-ONLY] LOW confidence ADAPTED ESTIMATES. SUPR-Q 65-72 range not independently verified from MeasuringU. Getting-Started Completion Rate 60% target from Baymard (order-of-magnitude only) and MeasuringU 2021 study (58% median, citation not independently confirmed). Skill Discovery Rate 25% target uses moving-average of weekly rates over 90-day window — weekly formula applies within window. 14-Day Return Rate uses rolling weekly cohort (7-day entry, 14-day observation) to avoid partial-observation bias."
  - "XP-02 OPEN QUESTION (iter-4): Causal ordering between Task Success and Happiness is unresolved. Equal instrumentation priority is model-agnostic derived AND now explicitly scoped to Phase 1 baseline measurement (remediation sequencing gated on Phase 1b). Skill Discovery Rate '7' threshold now annotated as Phase 1a approximation of 23% of 30-skill catalog (7/30 = 0.233) in both Metric Specifications and Handoff Data tables. Segment count of 3 is a provisional analytical inference — FEAT-040-053 must validate count as primary research question. Iter-4 self-reported composite: 0.911; expected adversarial: 0.920-0.922 (PASS band). Evidence Quality structurally capped ~0.89 (Phase 1a — benchmarks unverifiable); PASS expected via other dimensions."

