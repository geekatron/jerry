key_findings:
  - "Behavioral-system positioning gap is UNOCCUPIED. Every benchmarked framework (LangChain, CrewAI, OpenAI Agents SDK, Claude Agent SDK, LlamaIndex, AutoGen) positions around 'what you build with it.' None position around 'what it makes the AI reliably do.' Jerry's governance/quality-enforcement/memory architecture is architecturally distinct — this framing is the strongest positioning differentiator available."
  - "'Working code before prose' is the universal adoption driver. Claude Agent SDK (3 steps, 8 lines), OpenAI Agents SDK (4 steps, 5 lines), LangChain all lead with runnable examples before explanation. Time-to-first-output is the dominant documentation quality signal; frameworks that invert this show documented abandonment."
  - "Hidden capability catalog is Jerry's highest-risk adoption barrier. Surfacing 6 of 30 skills in the README is the single largest gap relative to all six benchmarks (capability catalogs are surfaced on landing pages). Maps directly to PROJ-040 Wave 2 README revision as pre-OSS-release blocker."
  - "Explicit Diataxis nav labels ('Tutorials' / 'How-To Guides') matter for discoverability. LangChain's 2024 refresh confirms generic nav labels ('Guides', 'Learn') reduce discoverability; label IS a content-type signal before the click."
  - "Governance transparency is a credibility signal no competitor has claimed. Publishing quality-enforcement.md and constitutional compliance in docs/explanation/ creates a differentiated contributor conversion story. No benchmarked framework offers this."

