name: diataxis-reference
description: >-
  Reference writer agent — produces information-oriented documentation following
  Diataxis methodology. Creates authoritative, structured technical descriptions
  that mirror the machinery they document. Invoke when users need neutral,
  austere reference documentation for APIs, configurations, or systems.
model: sonnet
tools: Read, Write, Edit, Glob, Grep, Bash
