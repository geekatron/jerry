---
composition_version: 1.0
agent_id: E2E-0002
agent_name: e2e-executor
role: Actor
skill: e2e-testing
version: 1.0.0
tool_tier: T3

references:
  identity: skills/e2e-testing/agents/e2e-executor.md
  governance: skills/e2e-testing/agents/e2e-executor.governance.yaml
  prompt_seed: skills/e2e-testing/composition/e2e-executor.prompt.md

invocation:
  default_subagent_type: jerry:ps-researcher
  default_template: skills/e2e-testing/templates/e2e-test-generation.md
  execution_contract: skills/e2e-testing/PLAYBOOK.md
  model: sonnet

inputs:
  required:
    - TESTRUN_ID
    - author_plan_path
    - feature_file_path
    - EXECUTION_MODE
    - AUTONOMY_TIER
    - SUT_URL
  optional:
    - spa_wait_strategy
    - playwright_mcp_version
    - screenshot_on_failure
    - retry_count

outputs:
  primary: executor-trace.json
  secondary:
    - "screenshots/{step}-{status}.png"
    - "dom-snapshots/{step}.json"
    - browser-errors.json
    - "{scenario}.spec.ts"
  location: "skills/e2e-testing/output/{TESTRUN_ID}/"
  levels:
    - L0
    - L1
    - L2

pipeline:
  upstream:
    - e2e-author
  downstream:
    - e2e-verifier
  never_escalates_to: e2e-author
  never_receives_from: e2e-verifier

owned_principles:
  - P-E2E-05
  - P-E2E-06
  - P-E2E-07

tool_surface:
  allowed:
    - mcp__playwright__browser_snapshot
    - mcp__playwright__browser_click
    - mcp__playwright__browser_type
    - mcp__playwright__browser_navigate
    - mcp__playwright__browser_verify_element_visible
    - mcp__playwright__browser_take_screenshot
    - mcp__playwright__browser_wait_for
    - mcp__playwright__browser_evaluate
    - Read
    - Write
  forbidden:
    - agent_delegate
    - Bash
    - WebSearch
    - WebFetch
    - Edit
    - Glob
    - Grep
  max_tools_exposed: 10

mcp_servers:
  playwright:
    package: "@playwright/mcp"
    version: pinned
    version_pin_authority: skills/e2e-testing/PLAYBOOK.md

autonomy:
  default_tier: SUPERVISED
  permitted_tiers:
    - AUTONOMOUS
    - SUPERVISED
    - MANAGED-EQUIVALENT

quality:
  threshold: 0.94
  criticality_default: C3

degradation:
  ad010_levels:
    - level: 0
      behaviour: full-pipeline-with-live-SUT
    - level: 1
      behaviour: plan-only-artifact-no-execution
    - level: 2
      behaviour: spec-ts-template-only

confidence_flags:
  single_study_genia_e2etest: true
  rt004_triangulated_threshold: true

constitution:
  reference: docs/governance/JERRY_CONSTITUTION.md
  principles_applied:
    - "P-003: No Recursive Subagents"
    - "P-020: User Authority"
    - "P-022: No Deception -- prompt-injection quarantine on DOM snapshot"
---
