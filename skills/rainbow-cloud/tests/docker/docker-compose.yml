---
# Docker Compose -- Rainbow Cloud Sub-Skill
# Tools: Checkov, Prowler, Kubescape
# Agent: rainbow-cloud-auditor
# Zone: 2 (Active Cloud Posture -- egress-controlled; Prowler/Kubescape require API access)

version: "3.9"

services:
  cloud-auditor:
    build:
      context: ./cloud-auditor
      dockerfile: Dockerfile
    image: rainbow-cloud-auditor:latest
    container_name: cloud-auditor
    working_dir: /work
    volumes:
      - cloud-output:/work/output
      - ../../output:/rainbow-output
      - ../../../../work:/work
    # Zone 2: custom bridge network with egress control.
    # Prowler and Kubescape require outbound API access; Checkov is local-only.
    # Target-specific ACLs applied at engagement init via rainbow-tool-exec --init-engagement.
    # Full structural enforcement (iptables egress ACLs) is target-state -- Phase 6.
    networks:
      - cloud-net
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true

volumes:
  cloud-output:

networks:
  cloud-net:
    driver: bridge
    # Zone 2 egress control: target ACLs generated from SCOPE.md at engagement init.
    # Default: bridge allows outbound; ACLs restrict to authorized targets only (Phase 6).
