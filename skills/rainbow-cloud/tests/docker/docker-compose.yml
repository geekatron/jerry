# SPDX-License-Identifier: MIT
# Zone 2: Cloud security posture assessment
# Tools: Checkov (IaC), Prowler (AWS/Azure/GCP), Kubescape (Kubernetes)
# Engagement scope required for Prowler/Kubescape (cloud account is the target).
# Checkov in IaC mode is offline; proxy does not restrict it.
#
# Architecture: ADR-PROJ023-003 v2 (Envoy Forward Proxy)
# EN-023-008: eBPF transparent proxy integration (BPF init sidecar + read-only bpffs)
# Task: T13-007

# --- BPF capability anchor (DC-2: init container pattern) ---
# bpf-init has write access; tool containers get read-only mounts.
x-bpf-init-capabilities: &bpf-init-capabilities
  cap_add:
    - CAP_BPF
    - CAP_NET_ADMIN
    - CAP_SYS_ADMIN
  security_opt:
    - no-new-privileges:true
  volumes:
    - /sys/fs/bpf:/sys/fs/bpf
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - bpf-objects:/opt/ebpf

services:

  # --- bpf-init: loads BPF program, populates bypass map, exits healthy ---
  # Uses BpfManager (Python) via the bpf-builder image. No shell scripts.
  # Constraint B2: BPF loaded BEFORE tool container starts (depends_on healthcheck).
  bpf-init:
    image: bpf-builder:latest
    container_name: cloud-bpf-init
    <<: *bpf-init-capabilities
    # Copy BPF object + bpftool to shared volume, then exit healthy.
    # BPF loading is wired via GatedLifecycleManager in TASK-023-165.
    # This service ensures artifacts are available; lifecycle manages attachment.
    command: >
      sh -c "cp /opt/ebpf/connect4.bpf.o /opt/ebpf/connect4.bpf.o &&
             cp /usr/local/bin/bpftool /opt/ebpf/bpftool &&
             chmod +x /opt/ebpf/bpftool &&
             echo 'BPF artifacts ready' && sleep infinity"
    networks:
      - zone2-active
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/ebpf/connect4.bpf.o"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  cloud-auditor:
    build:
      context: ./cloud-auditor
      dockerfile: Dockerfile
    image: rainbow-cloud-auditor:latest
    container_name: cloud-auditor
    working_dir: /work
    volumes:
      - cloud-output:/work/output
      - ../../../../work:/work
      - bpf-objects:/opt/ebpf:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
    networks:
      - zone2-active
    environment:
      HTTP_PROXY: "http://envoy-z2:3128"
      HTTPS_PROXY: "http://envoy-z2:3128"
      NO_PROXY: "localhost,127.0.0.1"
      PATH: "/opt/ebpf:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # DC-4: Disable IPv6 (connect4 only intercepts IPv4)
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    depends_on:
      envoy-z2:
        condition: service_started
      bpf-init:
        condition: service_healthy

  envoy-z2:
    # Zone 2 deny-by-default proxy for cloud API access.
    # Engagement scope must include cloud_account targets.
    # Cloud API endpoints (AWS STS, GCP IAM, Azure ARM) are added
    # to the generated Zone 2 Envoy config at --init-engagement time.
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ../../../../skills/rainbow/config/envoy/envoy-zone2-active.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-z2-logs:/var/log/envoy
      - ../../../../work:/work:ro
    networks:
      - zone2-active
      - zone2-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  zone2-active:
    driver: bridge
    internal: true
  zone2-egress:
    driver: bridge

volumes:
  cloud-output:
  envoy-z2-logs:
  bpf-objects:
