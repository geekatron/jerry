# SPDX-License-Identifier: MIT
# Zone 2: Active reconnaissance
# Tools: Subfinder, httpx, dnsx, naabu, katana, Nuclei
# Engagement scope required before execution (validated by CLI).
# Envoy enforces scope-derived allowlist at network level.
#
# Architecture: ADR-PROJ023-003 v2 (Envoy Forward Proxy)
# EN-023-008: eBPF transparent proxy integration (BPF init sidecar + read-only bpffs)
# Task: T13-009

# --- BPF capability anchor (DC-2: init container pattern) ---
# bpf-init has write access; tool containers get read-only mounts.
x-bpf-init-capabilities: &bpf-init-capabilities
  cap_add:
    - CAP_BPF
    - CAP_NET_ADMIN
    - CAP_SYS_ADMIN
  security_opt:
    - no-new-privileges:true
  volumes:
    - /sys/fs/bpf:/sys/fs/bpf
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - bpf-objects:/opt/ebpf

services:

  # --- bpf-init: loads BPF program, populates bypass map, exits healthy ---
  # Uses BpfManager (Python) via the bpf-builder image. No shell scripts.
  # Constraint B2: BPF loaded BEFORE tool container starts (depends_on healthcheck).
  bpf-init:
    image: bpf-builder:latest
    container_name: recon-bpf-init
    <<: *bpf-init-capabilities
    # Copy BPF object + bpftool to shared volume, then exit healthy.
    # BPF loading is wired via GatedLifecycleManager in TASK-023-165.
    # This service ensures artifacts are available; lifecycle manages attachment.
    command: >
      sh -c "cp /opt/ebpf/connect4.bpf.o /opt/ebpf/connect4.bpf.o &&
             cp /usr/local/bin/bpftool /opt/ebpf/bpftool &&
             chmod +x /opt/ebpf/bpftool &&
             echo 'BPF artifacts ready' && sleep infinity"
    networks:
      - zone2-active
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/ebpf/connect4.bpf.o"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  recon-pipeline:
    build:
      context: ./recon-pipeline
      dockerfile: Dockerfile
    image: rainbow-recon-pipeline:latest
    container_name: recon-pipeline
    working_dir: /work
    volumes:
      - ../../../../work:/work
      - bpf-objects:/opt/ebpf:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
    networks:
      - zone2-active
    environment:
      HTTP_PROXY: "http://envoy-z2:3128"
      HTTPS_PROXY: "http://envoy-z2:3128"
      # Exclude internal DNS resolution from proxy to avoid breaking dnsx
      # which uses raw DNS sockets (not HTTP). dnsx is NOT proxy-aware.
      NO_PROXY: "localhost,127.0.0.1"
      PATH: "/opt/ebpf:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # DC-4: Disable IPv6 (connect4 only intercepts IPv4)
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    security_opt:
      - no-new-privileges:true
    read_only: false
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    depends_on:
      envoy-z2:
        condition: service_started
      bpf-init:
        condition: service_healthy

  envoy-z2:
    # Zone 2 deny-by-default proxy.
    # Config generated from engagement scope YAML by:
    #   jerry tool exec --init-engagement <scope.yaml>
    # Config location: skills/rainbow/config/envoy/envoy-zone2-active.yaml
    # Access log: /var/log/envoy/access.log -> evidence volume.
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ../../../../skills/rainbow/config/envoy/envoy-zone2-active.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-z2-logs:/var/log/envoy
      - ../../../../work:/work:ro
    networks:
      - zone2-active
      - zone2-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  zone2-active:
    driver: bridge
    internal: true
    # Internal network: recon-pipeline cannot reach internet directly.
    # All HTTP/HTTPS egress routes through envoy-z2.
  zone2-egress:
    driver: bridge
    # External route. Only envoy-z2 is attached to this network.

volumes:
  envoy-z2-logs:
  bpf-objects:
