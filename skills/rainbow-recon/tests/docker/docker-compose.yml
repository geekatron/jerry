---
# Docker Compose -- Rainbow Recon Sub-Skill
# Tools: Subfinder, httpx, dnsx, naabu, katana, Nuclei
# Agent: rainbow-recon-pipeline
# Zone: 2 (Active Reconnaissance -- egress-controlled, engagement scope required)

version: "3.9"

services:
  recon-pipeline:
    build:
      context: ./recon-pipeline
      dockerfile: Dockerfile
    image: rainbow-recon-pipeline:latest
    container_name: recon-pipeline
    working_dir: /work
    volumes:
      - ../../../../work:/work
    # Zone 2: custom bridge network with egress control.
    # Target-specific ACLs applied at engagement init via jerry tool exec --init-engagement.
    # Full structural enforcement (iptables egress ACLs) is target-state -- Phase 6.
    networks:
      - recon-net
    security_opt:
      - no-new-privileges:true
    read_only: false
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true

networks:
  recon-net:
    driver: bridge
    # Zone 2 egress control: target ACLs generated from SCOPE.md at engagement init.
    # Default: bridge allows outbound; ACLs restrict to authorized targets only (Phase 6).
