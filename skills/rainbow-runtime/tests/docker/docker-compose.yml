# SPDX-License-Identifier: MIT
# Zone 2/3 boundary: runtime analysis and process instrumentation.
# mitmproxy: Zone 2 (network interception boundary -- captures traffic to/from targets).
# frida: Zone 3 (process attachment -- requires elevated capabilities).
# These services MUST NOT share a network namespace (zone isolation preserved).
#
# Architecture: ADR-PROJ023-003 v2 (Envoy Forward Proxy)
# EN-023-008: eBPF transparent proxy integration (BPF init sidecar + read-only bpffs)
# Task: T13-010

# --- BPF capability anchor (DC-2: init container pattern) ---
# bpf-init has write access; tool containers get read-only mounts.
x-bpf-init-capabilities: &bpf-init-capabilities
  cap_add:
    - CAP_BPF
    - CAP_NET_ADMIN
    - CAP_SYS_ADMIN
  security_opt:
    - no-new-privileges:true
  volumes:
    - /sys/fs/bpf:/sys/fs/bpf
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - bpf-objects:/opt/ebpf

services:

  # --- bpf-init: loads BPF program, populates bypass map, exits healthy ---
  # Uses BpfManager (Python) via the bpf-builder image. No shell scripts.
  # Constraint B2: BPF loaded BEFORE tool container starts (depends_on healthcheck).
  bpf-init:
    image: bpf-builder:test
    container_name: runtime-bpf-init
    <<: *bpf-init-capabilities
    # Verify BPF objects present (Docker initializes shared volume from image
    # /opt/ebpf/ contents on first mount), stage bpftool, signal ready.
    # BPF loading is wired via GatedLifecycleManager in TASK-023-165.
    # This service ensures artifacts are available; lifecycle manages attachment.
    command: >
      sh -c "test -f /opt/ebpf/connect4.bpf.o &&
             test -f /opt/ebpf/sockops.bpf.o &&
             test -f /opt/ebpf/getsockopt.bpf.o &&
             cp /usr/local/bin/bpftool /opt/ebpf/bpftool &&
             chmod +x /opt/ebpf/bpftool &&
             echo 'BPF artifacts ready' && sleep infinity"
    networks:
      - zone2-active
      - zone3-exploit
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/ebpf/connect4.bpf.o"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  mitmproxy:
    # mitmproxy, mitmdump, mitmweb: TLS-intercepting proxy for traffic analysis.
    # Zone 2: engagement scope required. Targets must be in allowlist.
    # Note: mitmproxy acts as a MITM proxy for tool traffic -- its OWN outbound
    # traffic (to targets it is proxying for) routes through envoy-z2.
    build:
      context: ./mitmproxy
      dockerfile: Dockerfile
    image: rainbow-runtime-mitmproxy:latest
    container_name: rainbow-runtime-mitmproxy
    ports:
      - "8080:8080"
    volumes:
      - ../../../../work:/work
    networks:
      - zone2-active
    environment:
      HTTP_PROXY: "http://envoy-z2:3128"
      HTTPS_PROXY: "http://envoy-z2:3128"
      NO_PROXY: "localhost,127.0.0.1"
    stdin_open: true
    tty: true
    depends_on:
      envoy-z2:
        condition: service_started

  frida:
    # frida, frida-trace, frida-ps: dynamic instrumentation.
    # Zone 3: per-operation approval required.
    # SYS_PTRACE capability required for process attachment.
    build:
      context: ./frida
      dockerfile: Dockerfile
    image: rainbow-runtime-frida:latest
    container_name: rainbow-runtime-frida
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../../../../work:/work
      - bpf-objects:/opt/ebpf:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
    networks:
      - zone3-exploit
    environment:
      HTTP_PROXY: "http://envoy-z3:3128"
      HTTPS_PROXY: "http://envoy-z3:3128"
      NO_PROXY: "localhost,127.0.0.1"
      PATH: "/opt/ebpf:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # DC-4: Disable IPv6 (connect4 only intercepts IPv4)
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    stdin_open: true
    tty: true
    depends_on:
      envoy-z3:
        condition: service_started
      bpf-init:
        condition: service_healthy

  envoy-z2:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ../../../../skills/rainbow/config/envoy/envoy-zone2-active.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-z2-logs:/var/log/envoy
      - ../../../../work:/work:ro
    networks:
      - zone2-active
      - zone2-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  envoy-z3:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ../../../../skills/rainbow/config/envoy/envoy-zone3-exploit.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-z3-logs:/var/log/envoy
      - ../../../../work:/work:ro
    networks:
      - zone3-exploit
      - zone3-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  zone2-active:
    driver: bridge
    internal: true
  zone2-egress:
    driver: bridge
  zone3-exploit:
    driver: bridge
    internal: true
  zone3-egress:
    driver: bridge

volumes:
  envoy-z2-logs:
  envoy-z3-logs:
  bpf-objects:
