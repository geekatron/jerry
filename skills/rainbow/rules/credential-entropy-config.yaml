# Credential Entropy Detection -- L2 Filter Configuration
# Shannon entropy-based detection for novel credential formats.
# Source: ADR-PROJ023-001, rainbow-credential-filter.md
#
# L2 catches high-entropy strings that evade L1 regex patterns.
# The allowlist prevents false positives on legitimate high-entropy output.

version: "1.0.0"

entropy:
  # Shannon entropy threshold: strings with entropy above this value are flagged
  # Rationale: API keys and tokens typically have entropy > 4.5
  # Natural language text typically has entropy 3.0-4.0
  threshold: 4.5

  # Minimum string length for entropy analysis
  # Strings shorter than this have insufficient entropy signal
  min_string_length: 16

  # Base64 decode-and-rescan: decode base64 candidates and re-evaluate
  base64_rescan: true
  base64_candidate_pattern: "^[A-Za-z0-9+/=]{20,}$"

  # String tokenization: how to extract candidate strings from output
  tokenization:
    # Split on whitespace and common delimiters
    delimiters: " \t\n\r,;|\"'`(){}[]<>"
    # Also evaluate quoted strings as single units
    preserve_quoted_strings: true

# Allowlist: high-entropy strings that are NOT credentials
# These patterns suppress L2 flagging even when entropy exceeds threshold.
# NOTE: L1 regex takes precedence -- if L1 flags a string, the allowlist
# does NOT override that detection.
allowlist:
  - id: "sha256-hash"
    pattern: "^[a-f0-9]{64}$"
    description: "SHA-256 hash -- legitimate integrity check output"
    reason: "Legitimate hash output from integrity checks"

  - id: "sha1-hash"
    pattern: "^[a-f0-9]{40}$"
    description: "SHA-1 hash -- git commits, file integrity"
    reason: "Git commit hashes, file integrity checks"

  - id: "md5-hash"
    # NOTE: MD5 hashes are allowlisted ONLY when they appear as standalone
    # 32-char hex strings. When they appear in LM:NT colon-pair format,
    # L1 Category 4 (NTLM) takes precedence over this allowlist entry.
    pattern: "^[a-f0-9]{32}$"
    description: "MD5 hash -- file integrity (not in NTLM context)"
    reason: "File integrity checks"

  - id: "uuid-standard"
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    description: "Standard UUID format"
    reason: "Standard UUID format used pervasively in tool output"

  - id: "hex-dump"
    pattern: "^(0x)?[0-9a-fA-F]{2}(\\s[0-9a-fA-F]{2}){7,}$"
    description: "Hex dump output -- space-separated byte pairs"
    reason: "Hex dump output from binary analysis tools"

  - id: "sha512-hash"
    pattern: "^[a-f0-9]{128}$"
    description: "SHA-512 hash -- integrity check output"
    reason: "Legitimate hash output from integrity checks"

  # Note: blake2b pattern intentionally subsumes sha256/sha512 for comprehensive hash detection
  - id: "blake2b-hash"
    pattern: "^[a-f0-9]{64,128}$"
    description: "BLAKE2b hash -- integrity check output"
    reason: "Legitimate hash output from integrity checks"

# Processing configuration
processing:
  # Maximum time for L2 analysis before timeout (seconds)
  timeout_seconds: 2
  # Maximum number of strings to analyze per output block
  max_strings_per_block: 10000
  # Strings exceeding this length are analyzed in chunks
  max_string_length: 4096
