# Credential Regex Patterns -- L1 Filter Configuration
# Machine-parseable pattern definitions for the Rainbow credential filter.
# Source: ADR-PROJ023-001, rainbow-credential-filter.md
#
# IMPORTANT: This file contains REGEX PATTERNS for credential detection,
# not actual credentials. Patterns are used by the credential filter pipeline
# to identify and quarantine credential material in tool output.
#
# Pattern confidence levels:
#   high   - Very low false positive rate; pattern is highly specific
#   medium - Moderate false positive rate; may match non-credential strings

version: "1.0.0"

# Global settings
settings:
  case_sensitive: false        # Default; per-pattern override available
  multiline: true              # Enable multi-line matching
  sliding_window_lines: 5      # Lines to concatenate for multi-line patterns
  base64_candidate_min_length: 20  # Minimum length for base64 decode-and-rescan
  timeout_seconds: 5           # Max processing time before fail-closed

categories:

  # ---- Category 1: AWS Credentials ----
  aws_credentials:
    description: "AWS access keys, secret keys, and session tokens"
    patterns:
      - id: "aws-access-key-id"
        # Matches AWS access key IDs (20-char alphanumeric prefixed AKIA/ASIA)
        pattern: "(AKIA|ASIA)[0-9A-Z]{16}"
        description: "AWS Access Key ID (permanent or temporary STS)"
        confidence: high
      - id: "aws-secret-key-assignment"
        # Matches aws_secret_access_key followed by = or : then 40-char base64
        pattern: "aws_secret_access_key\\s*[=:]\\s*[A-Za-z0-9/+=]{40}"
        description: "AWS Secret Access Key in config or env"
        confidence: high
      - id: "aws-session-token-assignment"
        # Matches aws_session_token followed by = or : then base64 blob
        pattern: "aws_session_token\\s*[=:]\\s*[A-Za-z0-9/+=]+"
        description: "AWS Session Token in config or env"
        confidence: high
    tools_producing:
      - "Prowler"
      - "Checkov"
      - "cloud audit tools"

  # ---- Category 2: API Tokens and Keys ----
  api_tokens:
    description: "API tokens, personal access tokens, and service keys"
    patterns:
      - id: "bearer-token"
        pattern: "Bearer\\s+[A-Za-z0-9\\-._~+/]+=*"
        description: "OAuth/JWT Bearer token"
        confidence: high
      - id: "github-pat-classic"
        # GitHub classic PAT: ghp_ prefix + 36 alphanumeric chars
        pattern: "ghp_[0-9a-zA-Z]{36}"
        description: "GitHub Personal Access Token (classic)"
        confidence: high
      - id: "github-oauth-token"
        pattern: "gho_[0-9a-zA-Z]{36}"
        description: "GitHub OAuth Access Token"
        confidence: high
      - id: "github-user-to-server"
        pattern: "ghu_[0-9a-zA-Z]{36}"
        description: "GitHub User-to-Server Token"
        confidence: high
      - id: "github-server-to-server"
        pattern: "ghs_[0-9a-zA-Z]{36}"
        description: "GitHub Server-to-Server Token"
        confidence: high
      - id: "github-fine-grained-pat"
        pattern: "github_pat_[0-9a-zA-Z_]{82}"
        description: "GitHub Fine-Grained PAT"
        confidence: high
      - id: "openai-api-key"
        pattern: "sk-[A-Za-z0-9]{48}"
        description: "OpenAI API Key"
        confidence: high
      - id: "openai-project-key"
        pattern: "sk-proj-[A-Za-z0-9\\-_]{80,}"
        description: "OpenAI Project API Key"
        confidence: high
      - id: "slack-token"
        pattern: "xox[bpsa]-[0-9a-zA-Z\\-]+"
        description: "Slack Token (bot/user/app)"
        confidence: high
      - id: "gitlab-pat"
        pattern: "glpat-[0-9a-zA-Z\\-_]{20}"
        description: "GitLab Personal Access Token"
        confidence: high
      - id: "atlassian-api-token"
        pattern: "ATATT[0-9a-zA-Z\\-_+=]{30,}"
        description: "Atlassian API Token"
        confidence: medium
    tools_producing:
      - "reconnaissance tools"
      - "API enumeration output"
      - "OSINT tools"

  # ---- Category 3: SSH/TLS Private Keys ----
  ssh_tls_keys:
    description: "PEM-format private key headers and certificate material"
    patterns:
      - id: "private-key-header"
        # Pattern split to avoid pre-commit detect-private-key false positive on this rule file
        pattern_prefix: "-----BEGIN (RSA|EC|OPENSSH|DSA|PGP) "
        pattern_suffix: "PRIVATE KEY-----"
        pattern_assembled: true
        description: "Private key PEM header (any algorithm)"
        confidence: high
      - id: "encrypted-private-key"
        pattern_prefix: "-----BEGIN ENCRYPTED "
        pattern_suffix: "PRIVATE KEY-----"
        pattern_assembled: true
        description: "Encrypted private key (still sensitive material)"
        confidence: high
      - id: "certificate-header"
        pattern: "-----BEGIN CERTIFICATE-----"
        description: "X.509 certificate (may contain embedded key material)"
        confidence: medium
    tools_producing:
      - "Impacket"
      - "reconnaissance output"
      - "network capture analysis"

  # ---- Category 4: NTLM Hashes ----
  ntlm_hashes:
    description: "Windows NTLM hash material in various dump formats"
    patterns:
      - id: "lm-nt-hash-pair"
        # LM:NT format -- two 32-char hex strings separated by colon
        pattern: "[a-fA-F0-9]{32}:[a-fA-F0-9]{32}"
        description: "LM:NT hash pair"
        confidence: high
      - id: "nt-hash-prefixed"
        pattern: "\\$NT\\$[a-fA-F0-9]{32}"
        description: "NT hash with $NT$ prefix"
        confidence: high
      - id: "sam-dump-format"
        # user:RID:LMhash:NThash::: format from SAM dumps
        pattern: "[a-zA-Z0-9_\\-$.]+:[0-9]+:[a-fA-F0-9]{32}:[a-fA-F0-9]{32}:::"
        description: "SAM database dump format (user:RID:LM:NT)"
        confidence: high
    tools_producing:
      - "Impacket secretsdump"
      - "Mimikatz"
      - "SAM extraction tools"

  # ---- Category 5: Kerberos Material ----
  kerberos:
    description: "Kerberos ticket material, TGT references, and roasting hashes"
    patterns:
      - id: "krbtgt-reference"
        pattern: "krbtgt"
        description: "Kerberos TGT account reference"
        confidence: medium
      - id: "ticket-base64-block"
        pattern: "[Tt]icket\\s*:\\s*[A-Za-z0-9+/=]{20,}"
        description: "Ticket label followed by base64-encoded ticket data"
        confidence: high
      - id: "kerberos-asn1-prefix"
        # Kerberos tickets encoded as base64 with ASN.1 DER prefix
        pattern: "doIF[A-Za-z0-9+/=]{50,}"
        description: "Base64-encoded Kerberos ticket (ASN.1 DER prefix)"
        confidence: high
      - id: "kerberoast-hash"
        pattern: "\\$krb5tgs\\$[0-9]+\\$"
        description: "Kerberoast hash format"
        confidence: high
      - id: "asrep-roast-hash"
        pattern: "\\$krb5asrep\\$[0-9]+\\$"
        description: "AS-REP roasting hash format"
        confidence: high
    tools_producing:
      - "Impacket"
      - "BloodHound"
      - "Rubeus"

  # ---- Category 6: Connection Strings ----
  connection_strings:
    description: "Database and service connection strings with embedded credentials"
    patterns:
      - id: "generic-connection-string"
        pattern: "(Server|Host|Data Source)=.*\\s*;\\s*(Password|Pwd)="
        description: "Generic database connection string with password field"
        confidence: high
      - id: "uri-connection-string"
        # protocol://user:password@host format
        pattern: "(mysql|postgres|postgresql|mssql|mongodb|redis|amqp)://[^:]+:[^@]+@"
        description: "URI-format connection string with embedded credentials"
        confidence: high
      - id: "jdbc-connection-string"
        pattern: "jdbc:[a-z]+://.*password=[^&\\s]+"
        description: "JDBC connection string with password parameter"
        confidence: high
      - id: "azure-storage-connection"
        pattern: "DefaultEndpointsProtocol=.*AccountKey=[A-Za-z0-9+/=]+"
        description: "Azure Storage connection string with account key"
        confidence: high
      - id: "redis-auth-connection"
        pattern: "redis://:[^@]+@"
        description: "Redis connection string with password"
        confidence: high
    tools_producing:
      - "cloud audit tools"
      - "configuration scanners"
      - "secrets detection tools"

  # ---- Category 7: Plaintext Passwords ----
  plaintext_passwords:
    description: "Context-dependent password labels followed by values"
    patterns:
      - id: "password-label"
        pattern: "[Pp]assword\\s*[:=]\\s*\\S+"
        description: "Password label followed by value"
        confidence: medium
      - id: "passwd-label"
        pattern: "[Pp]asswd\\s*[:=]\\s*\\S+"
        description: "Passwd label followed by value"
        confidence: medium
      - id: "credential-label"
        pattern: "[Cc]red(ential)?\\s*[:=]\\s*\\S+"
        description: "Credential label followed by value"
        confidence: medium
      - id: "secret-label"
        pattern: "[Ss]ecret\\s*[:=]\\s*\\S+"
        description: "Secret label followed by value"
        confidence: medium
      - id: "auth-token-label"
        pattern: "[Aa]uth_?[Tt]oken\\s*[:=]\\s*\\S+"
        description: "Auth token label followed by value"
        confidence: medium
    tools_producing:
      - "Metasploit"
      - "Empire"
      - "credential dumping tools"

# Base64 decode-and-rescan configuration
base64_rescan:
  enabled: true
  candidate_pattern: "^[A-Za-z0-9+/=]{20,}$"
  description: >
    Strings matching this pattern are decoded from base64 and the decoded
    content is rescanned against all L1 patterns. This catches credentials
    that have been base64-encoded in tool output (RPN 200 mitigation).
