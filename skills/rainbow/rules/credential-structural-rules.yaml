# Credential Structural Analysis -- L3 Filter Configuration
# JSON/YAML/XML/INI key-name matching against sensitive field patterns.
# Source: ADR-PROJ023-001, rainbow-credential-filter.md
#
# L3 catches credentials embedded in structured output where the key name
# reveals the value's sensitivity, even when the value itself does not
# match L1 regex patterns or L2 entropy thresholds.

version: "1.0.0"

# Sensitive key patterns: keys matching these patterns trigger credential
# detection when paired with non-empty, non-placeholder values.
sensitive_key_patterns:
  - id: "password-key"
    pattern: "password"
    case_insensitive: true
    description: "Any key containing 'password'"
    exclude_contexts: []

  - id: "secret-key"
    pattern: "secret"
    case_insensitive: true
    description: "Any key containing 'secret'"
    exclude_contexts: []

  - id: "token-key"
    pattern: "token"
    case_insensitive: true
    description: "Any key containing 'token'"
    exclude_contexts: []

  - id: "key-key"
    pattern: "key"
    case_insensitive: true
    description: "Any key containing 'key' (with context exclusions)"
    exclude_contexts:
      - "public_key"
      - "key_name"
      - "key_id"
      - "primary_key"
      - "foreign_key"
      - "sort_key"
      - "partition_key"
      - "key_type"
      - "key_length"
      - "key_usage"
      - "key_vault"
      - "registry_key"

  - id: "credential-key"
    pattern: "credential"
    case_insensitive: true
    description: "Any key containing 'credential'"
    exclude_contexts: []

  - id: "auth-key"
    pattern: "auth"
    case_insensitive: true
    description: "Any key containing 'auth' (with context exclusions)"
    exclude_contexts:
      - "author"
      - "authority"
      - "authorization_url"
      - "auth_type"
      - "auth_method"
      - "auth_provider"
      - "auth_endpoint"
      - "authenticated"
      - "authentication_method"

  - id: "private-key"
    pattern: "private"
    case_insensitive: true
    description: "Any key containing 'private' (with context exclusions)"
    exclude_contexts:
      - "private_ip"
      - "private_subnet"
      - "private_dns"
      - "private_zone"
      - "private_network"
      - "is_private"

  - id: "apikey-key"
    pattern: "apikey"
    case_insensitive: true
    description: "Any key matching 'apikey' (no separator)"
    exclude_contexts: []

  - id: "api-key-key"
    pattern: "api_key"
    case_insensitive: true
    description: "Any key matching 'api_key' (underscore separator)"
    exclude_contexts: []

  - id: "access-key-key"
    pattern: "access_key"
    case_insensitive: true
    description: "Any key matching 'access_key'"
    exclude_contexts: []

  - id: "secret-key-key"
    pattern: "secret_key"
    case_insensitive: true
    description: "Any key matching 'secret_key'"
    exclude_contexts: []

  - id: "connection-string-key"
    pattern: "connection_string"
    case_insensitive: true
    description: "Any key matching 'connection_string'"
    exclude_contexts: []

  - id: "conn-str-key"
    pattern: "conn_str"
    case_insensitive: true
    description: "Any key matching 'conn_str' (abbreviated)"
    exclude_contexts: []

# Placeholder values that indicate the value has already been redacted.
# Keys matching sensitive patterns but with placeholder values are NOT flagged.
placeholder_values:
  - "***"
  - "****"
  - "*****"
  - "REDACTED"
  - "[REDACTED]"
  - "<redacted>"
  - "<masked>"
  - "[MASKED]"
  - "null"
  - "None"
  - "N/A"
  - ""
  - "xxxxxxxx"
  - "XXXXXXXX"

# Supported structured formats for parsing
supported_formats:
  - format: "json"
    detection: "Content starts with { or [ after whitespace trimming"
  - format: "yaml"
    detection: "Content contains key: value patterns without JSON brackets"
  - format: "xml"
    detection: "Content starts with < and contains matching close tags"
  - format: "ini"
    detection: "Content contains [section] headers and key=value lines"
  - format: "env"
    detection: "Content contains KEY=VALUE lines (one per line, no sections)"
  - format: "properties"
    detection: "Content contains key=value or key:value lines (Java properties)"

# Nested key handling configuration
nesting:
  # Evaluate both leaf key and full dot-path
  # Example: {"db": {"conn": {"password": "val"}}} checks both
  # "password" and "db.conn.password"
  evaluate_leaf_key: true
  evaluate_full_path: true
  # Maximum nesting depth to traverse
  max_depth: 20
  # Path separator for dot-path construction
  path_separator: "."

# Processing configuration
processing:
  # Maximum time for L3 analysis before timeout (seconds)
  timeout_seconds: 2
  # Maximum output size to parse as structured data (bytes)
  max_parse_size: 1048576  # 1 MB
  # If structured parsing fails, fall back to line-by-line key=value scanning
  fallback_to_line_scan: true
