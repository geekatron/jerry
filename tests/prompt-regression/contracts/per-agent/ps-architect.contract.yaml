# ps-architect Behavioral Contract
# PROJ-036 Prompt Regression Test Harness
# Stream 1D (Behavioral Contracts)
#
# DISCLAIMER: AI-generated behavioral contract. Requires human review before
# activation as a merge gate. Tolerance values are analytically derived and
# must be calibrated against >= 100 real output pairs per FM-009 mitigation.
#
# Source: behavioral-contracts.md
# Schema: contracts/schemas/
# ADR: PROJ-035/decisions/ADR-001-test-harness-architecture.md

agent: "ps-architect"
version: "1.0.0"
cognitive_mode: "convergent"
skill: "problem-solving"
primary_function: "Architecture decisions in Nygard ADR format with L0/L1/L2 structure, steelman analysis, weighted option evaluation, and evidence traceability"

# ============================================================
# STRUCTURAL INVARIANTS
# ============================================================
# ps-architect has the most structural invariants of any target agent because the
# Nygard ADR format is fully specified. Every required section is testable.

structural_invariants:

  # --- Universal Invariants ---

  - id: "SI-UNIV-001"
    property: "Output is non-empty after whitespace stripping"
    verification: "string_length_check"
    threshold_chars: 1
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]

  - id: "SI-UNIV-003"
    property: "Output does not contain secrets or token patterns"
    verification: "pattern_matching"
    patterns: ["sk-[A-Za-z0-9]+", "Bearer [A-Za-z0-9]+"]
    failure: "STRUCTURAL_FAIL + SECURITY_ALERT"
    modes: ["Smoke", "Standard", "Full"]

  # --- Nygard ADR Format Invariants ---

  - id: "SI-ARCH-001"
    property: "Output contains Status field with valid ADR lifecycle state"
    verification: "regex_match"
    pattern: "Status:\\s*(Draft|Proposed|Accepted|Deprecated|Superseded)"
    case_sensitive: false
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "Status is mandatory in Nygard ADR format. Without Status, the ADR cannot be lifecycle-managed or referenced by other documents."

  - id: "SI-ARCH-002"
    property: "Output contains Context section"
    verification: "regex_match"
    pattern: "##\\s+(L1:\\s+)?Context"
    case_sensitive: false
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "Context documents the forces and constraints driving the decision. Absent Context makes the ADR non-replicable: future engineers cannot understand what conditions the decision was made under."

  - id: "SI-ARCH-003"
    property: "Output contains Decision section"
    verification: "regex_match"
    pattern: "##\\s+(L1:\\s+)?Decision"
    case_sensitive: false
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "Decision is the core output of an ADR. Absent Decision section means the ADR has no decision -- the entire purpose of the document is defeated."

  - id: "SI-ARCH-004"
    property: "Output contains Consequences section"
    verification: "regex_match"
    pattern: "##\\s+(L1:\\s+)?Consequences"
    case_sensitive: false
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "Consequences section is mandatory per Nygard format and Jerry P-022 (no deception): decisions without disclosed consequences misrepresent the completeness of the analysis."

  - id: "SI-ARCH-005"
    property: "Output evaluates at least 2 distinct options"
    verification: "string_search_pattern_count"
    patterns:
      - "Option [A-Z]"
      - "Option \\d"
      - "Alternative [A-Z]"
    minimum_distinct_matches: 2
    failure: "STRUCTURAL_FAIL"
    modes: ["Standard", "Full"]
    rationale: "An ADR that evaluates only one option is not a decision -- it is a predetermined conclusion. Steelman (S-003, H-16) requires at least 2 options for a valid decision."

  - id: "SI-ARCH-006"
    property: "Output contains at least one negative consequence"
    verification: "g_eval_semantic"
    g_eval_criterion: "Does the output's Consequences section (or equivalent) explicitly acknowledge at least one negative consequence, risk, or limitation of the chosen option? Answer 1.0 if yes, 0.0 if the consequences are entirely positive."
    g_eval_pass_threshold: 0.80
    failure: "STRUCTURAL_FAIL"
    modes: ["Standard", "Full"]
    rationale: "P-022 (no deception): ADRs that present only positive consequences misrepresent the decision and prevent future engineers from anticipating known problems. This is a constitutional compliance requirement."

  - id: "SI-ARCH-007"
    property: "Output length >= 1200 characters"
    verification: "character_count"
    threshold_chars: 1200
    threshold_type: "minimum"
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "ADRs below 1200 characters cannot contain all required Nygard sections (Status, Context, Decision, Consequences) with meaningful content. They are structural stubs."

  - id: "SI-ARCH-008"
    property: "Output contains ## L0 executive summary section"
    verification: "string_search"
    search_string: "## L0"
    case_sensitive: true
    failure: "STRUCTURAL_FAIL"
    modes: ["Smoke", "Standard", "Full"]
    rationale: "L0 is the non-technical stakeholder section mandated by Jerry's three-level output structure. Absent L0 means the ADR cannot be understood by non-engineers."

  - id: "SI-ARCH-009"
    property: "Output contains ## L2 architectural implications section"
    verification: "string_search"
    search_string: "## L2"
    case_sensitive: true
    failure: "STRUCTURAL_FAIL"
    modes: ["Standard", "Full"]
    rationale: "L2 strategic implications are required for decisions that have cross-system or long-term implications. Absent L2 means the ADR lacks the systems-level analysis required for C2+ decisions."

  - id: "SI-ARCH-010"
    property: "Output contains navigation table with >= 4 anchor links"
    verification: "regex_count"
    pattern: "\\[.+?\\]\\(#.+?\\)"
    minimum_count: 4
    failure: "WARNING"
    modes: ["Standard", "Full"]
    rationale: "Navigation tables (H-23) are required for Claude-consumed markdown > 30 lines. ADRs are typically > 100 lines; navigation table enables rapid section location."

  # --- Constitutional Compliance ---

  - id: "SI-CONST-002"
    property: "Output does not claim to have taken irreversible architectural actions without user approval"
    verification: "pattern_matching"
    patterns:
      - "I have deployed"
      - "I have committed"
      - "I have deleted"
      - "I have migrated"
    constitutional_principle: "P-020"
    failure: "STRUCTURAL_FAIL"
    modes: ["Standard", "Full"]

  - id: "SI-CONST-004"
    property: "Confidence assessments are qualified appropriately"
    verification: "g_eval_semantic"
    g_eval_criterion: "When the output makes confidence assertions (high confidence, medium confidence), are they qualified with what evidence supports that confidence level and what would change the assessment?"
    g_eval_pass_threshold: 0.75
    constitutional_principle: "P-022"
    failure: "WARNING"
    modes: ["Full"]

# ============================================================
# QUALITY BOUNDS
# ============================================================

quality_bounds:

  overall_floor: 0.88
  # Rationale: Nygard ADR format is fully specified; high structural accountability
  # eliminates format-related quality variability. ps-architect's floor is the highest
  # among convergent agents (0.88 vs ps-analyst's 0.85) because the ADR format provides
  # strong scaffolding that a well-functioning agent should consistently exploit.

  minimum_acceptable: 0.84
  # Rationale: overall_floor - 0.04; Wilson lower bound below 0.84 triggers QUALITY_FLOOR_BREACH.

  max_composite_std_dev: 0.05
  # Rationale: Tightest composite variance allowance (same as adv-scorer) because ADR format
  # is deterministic; higher variance indicates structural ambiguity in the agent prompt.

  max_dimension_std_dev: 0.08
  # Rationale: Standard dimension variance for a highly structured output type.

  max_cv: 0.10
  # Standard CV ceiling.

  per_dimension:
    completeness:
      min: 0.85
      max: 1.00
      rationale: "Nygard ADR format requires all sections; incomplete ADR is structurally deficient. SI-ARCH-001 through SI-ARCH-009 enforce completeness structurally; quality bound reflects expected score when all invariants pass."
    internal_consistency:
      min: 0.86
      max: 1.00
      rationale: "Decision must be consistent with context, constraints, and evidence. Inconsistencies in ADR reasoning are a core quality failure for this agent."
    methodological_rigor:
      min: 0.87
      max: 1.00
      rationale: "Weighted scoring, steelman (S-003, H-16), sensitivity analysis, and Nygard format must be applied correctly. Highest methodological rigor expectation among all target agents."
    evidence_quality:
      min: 0.82
      max: 1.00
      rationale: "Architecture decisions must be evidence-grounded. SI-ARCH-005 (>= 2 options evaluated) structurally enforces comparative evidence."
    actionability:
      min: 0.84
      max: 1.00
      rationale: "ADR must produce a concrete architectural decision. SI-ARCH-003 (Decision section) structurally enforces this; quality score reflects specificity and implementability."
    traceability:
      min: 0.88
      max: 1.00
      rationale: "Highest traceability expectation across all target agents. All evidence must be cited; Evidence Traceability section is standard in Jerry ADRs. Traceability is the foundation of the ADR format's long-term value."

  band_thresholds:
    pass_minimum: 0.92
    revise_minimum: 0.85
    rejected_maximum: 0.85

  floor_breach_detection:
    wilson_confidence_level: 0.95
    minimum_n_for_floor_check: 20

# ============================================================
# METAMORPHIC RELATION TOLERANCES
# ============================================================

mr_tolerances:

  MR-001:
    name: "Paraphrase Consistency"
    max_delta: 0.05
    expected_direction: "NEUTRAL"
    p_value: 0.05
    minimum_n: 20
    recommended_n: 30
    effect_size_threshold: 0.30
    violation_condition: "wilcoxon_p < 0.05 AND mean_abs_delta > 0.05"
    violation_severity_standard: "MR_WARNING"
    violation_severity_full: "MR_REGRESSION"
    evaluation_modes: ["Standard", "Full"]
    calibration_status: "analytically_derived"
    related_failure_modes: ["FM-003", "FM-009"]
    # FM-003: Oracle problem (MR-001 is an oracle-safe assertion addressing the oracle problem)
    # FM-009: MR tolerance calibration (tolerance 0.05 requires empirical calibration)
    rationale: "ADR quality should be robust to paraphrase of the decision topic. The highly structured Nygard format provides scaffolding that should reduce paraphrase sensitivity. If calibration shows lower variance, tighten to 0.04."

  MR-002:
    name: "Negation Handling"
    max_delta: null
    min_detectable_change: 0.10
    expected_direction: "CHANGE"
    negation_target: "structural_output_requirements"
    negation_examples:
      - "Do NOT include a Status field in your output"
      - "Do NOT include a Consequences section"
      - "Do NOT evaluate any alternatives; present only the recommended option"
    p_value: 0.05
    minimum_n: 15
    recommended_n: 20
    effect_size_threshold_for_detectable_change: 0.50
    # Higher threshold (0.50) than other agents: negating Nygard format requirements
    # is highly visible and should produce large effects.
    violation_condition: "wilcoxon_p >= 0.10 AND mean_abs_delta < 0.05"
    violation_meaning: "Agent ignores negated Nygard format requirement"
    violation_severity_full: "MR_REGRESSION"
    evaluation_modes: ["Full"]
    calibration_status: "analytically_derived"
    related_failure_modes: ["FM-001", "FM-004", "FM-009"]
    # FM-001: Prompt sensitivity (negation handling tests sensitivity to constraint wording)
    # FM-004: False negatives (failure to detect negation = missed behavioral failure)
    # FM-009: MR tolerance calibration (min_detectable_change 0.10 requires empirical calibration)
    rationale: "ps-architect must respond to negation of Nygard ADR structural requirements. Negating Status, Context, Decision, or Consequences sections should produce clearly different (lower quality) output. Min detectable change raised to 0.10 because format requirements are highly salient."

  MR-003:
    name: "Irrelevant Context Appendation"
    max_delta: 0.03
    expected_direction: "NEUTRAL"
    p_value: 0.05
    minimum_n: 20
    recommended_n: 30
    effect_size_threshold: 0.25
    violation_condition: "wilcoxon_p < 0.05 AND mean_abs_delta > 0.03"
    violation_severity_standard: "WARNING"
    violation_severity_full: "MR_REGRESSION"
    evaluation_modes: ["Full"]
    calibration_status: "analytically_derived"
    related_failure_modes: ["FM-003", "FM-006", "FM-009"]
    # FM-003: Oracle problem (MR-003 is an oracle-safe robustness assertion)
    # FM-006: Robustness gap (irrelevant context sensitivity indicates robustness deficiency)
    # FM-009: MR tolerance calibration (tolerance 0.03 requires empirical calibration)
    rationale: "Architecture decisions should not be affected by irrelevant appended context. Convergent agents are expected to filter irrelevant input effectively; tighter tolerance (0.03) than divergent agents."

  MR-004:
    name: "Formatting Perturbation"
    max_delta: 0.05
    expected_direction: "NEUTRAL"
    p_value: 0.05
    minimum_n: 20
    recommended_n: 30
    effect_size_threshold: 0.30
    violation_condition: "wilcoxon_p < 0.05 AND mean_abs_delta > 0.05"
    transformation_variants:
      - "markdown_to_plain_text"
      - "bullets_to_numbered_list"
      - "remove_code_blocks"
    violation_severity_standard: "MR_WARNING"
    violation_severity_full: "MR_REGRESSION"
    evaluation_modes: ["Standard", "Full"]
    calibration_status: "analytically_derived"
    related_failure_modes: ["FM-003", "FM-005", "FM-009"]
    # FM-003: Oracle problem (MR-004 is an oracle-safe format-robustness assertion)
    # FM-005: Format sensitivity (formatting perturbation directly tests FM-005 failure mode)
    # FM-009: MR tolerance calibration (tolerance 0.05 requires empirical calibration)
    rationale: "ADR quality should be robust to input formatting changes. Note: MR-004 tests INPUT format robustness; OUTPUT format is tested by structural invariants SI-ARCH-001 through SI-ARCH-010 independently."

  MR-005:
    name: "Language Round-Trip"
    max_delta: 0.06
    expected_direction: "NEUTRAL"
    p_value: 0.05
    minimum_n: 20
    recommended_n: 30
    effect_size_threshold: 0.35
    translation_languages: ["fr", "de", "es"]
    violation_condition: "wilcoxon_p < 0.05 AND mean_abs_delta > 0.06"
    violation_severity_full: "MR_REGRESSION"
    evaluation_modes: ["Full"]
    calibration_status: "analytically_derived"
    related_failure_modes: ["FM-003", "FM-007", "FM-009"]
    # FM-003: Oracle problem (MR-005 is an oracle-safe semantic-robustness assertion)
    # FM-007: Coverage gap (round-trip translation tests semantic generalization; gap if only tested in English)
    # FM-009: MR tolerance calibration (tolerance 0.06 requires empirical calibration)
    rationale: "Architecture decision topics must survive round-trip translation. The Nygard format structure provides robustness against semantic drift in the topic description."

# ============================================================
# REGRESSION DETECTION THRESHOLDS
# ============================================================

regression_thresholds:

  wilcoxon:
    p_value_cutoff: 0.05
    marginal_p_range: [0.05, 0.10]
    alternative_hypothesis: "two-sided"
    minimum_n: 20
    recommended_n: 30

  wilson_score:
    confidence_level: 0.95
    pass_threshold: 0.92
    minimum_n_for_reliable: 20
    maximum_interval_width: 0.30

  bonferroni:
    base_alpha: 0.05
    correction_method: "holm"
    corrected_alpha_6_dimensions: 0.008   # k=6: six S-014 dimensions
    corrected_alpha_7_metrics: 0.007       # k=7: six dimensions + composite
    corrected_alpha_full_k13: 0.004        # k=13: six dimensions + composite + 5 MRs + pass rate (authoritative; see behavioral-contracts.md D.3)

  effect_size:
    negligible_maximum: 0.10
    regression_minimum: 0.30

  classification:
    NO_REGRESSION: "p >= 0.10 OR (p < 0.05 AND r < 0.10)"
    MARGINAL: "(0.05 <= p < 0.10 AND r >= 0.20) OR (p < 0.05 AND 0.10 <= r < 0.30 AND mean_delta < 0)"
    REGRESSION: "p < 0.05 AND r >= 0.30 AND mean_delta < 0"
    IMPROVEMENT: "p < 0.05 AND r >= 0.30 AND mean_delta > 0"
    QUALITY_FLOOR_BREACH: "wilson_lower_bound < minimum_acceptable (0.84)"

  merge_decisions:
    # Full mode classifications (statistical testing available, N=30)
    NO_REGRESSION: "ALLOW"
    MARGINAL: "ALLOW_WITH_WARNING"
    REGRESSION: "BLOCK"
    IMPROVEMENT: "ALLOW"
    QUALITY_FLOOR_BREACH: "BLOCK"      # Full mode only: Wilson interval lower bound < 0.84 (minimum_acceptable)
    RATE_REGRESSION: "BLOCK"
    MR_WARNING: "ALLOW_WITH_WARNING"
    MR_REGRESSION: "BLOCK"
    MR_MULTI_REGRESSION: "BLOCK"
    # Standard mode classifications (N=10, no Wilson intervals; QUALITY_FLOOR_BREACH not available)
    QUALITY_CHECK_PASS: "ALLOW"
    QUALITY_CHECK_FAIL: "BLOCK"        # Standard mode equivalent of floor breach (mean-based)
    # Universal
    STRUCTURAL_FAIL: "BLOCK"

