      - id: 4
        name: "Rainbow Orchestrator Container Lifecycle Management"
        path_id: "phase-4"
        status: "IN_PROGRESS"
        started_at: "2026-03-20T00:00:00Z"
        completed_at: null
        agents: []
        artifacts: []
        outcome: null
        description: >
          Design and implement container lifecycle management in rainbow-orchestrator.
          The orchestrator should detect which Docker clusters a request needs,
          verify containers are running, start them if not, wait for health checks,
          then dispatch to the agent. Currently the skill loads agent definitions
          but has zero awareness of container state.
        critical_findings_tasks:
          - id: "CLM-001"
            source: "PM-001"
            severity: "Critical"
            title: "Docker daemon restart invalidates state file"
            description: "PID check in state file passes even after Docker daemon restart. State file says containers running but Docker has no record. Fix: always verify against Docker reality (docker compose ps) before trusting state file. Never skip the Docker check."
            status: "TODO"
          - id: "CLM-002"
            source: "PM-002"
            severity: "Critical"
            title: "Concurrent worktrees share COMPOSE_PROJECT_NAME"
            description: "Two worktree sessions manipulate the same compose project simultaneously causing mutual destruction. Fix: derive COMPOSE_PROJECT_NAME from worktree path hash or CLAUDE_PROJECT_DIR to isolate compose projects per worktree."
            status: "TODO"
          - id: "CLM-003"
            source: "PM-003"
            severity: "Critical"
            title: "Zone 3 teardown deletes state before verifying containers are down"
            description: "Failed teardown deletes state file before confirming containers stopped. Exploit containers leak with no recovery path. Fix: verify containers are down (docker compose ps) BEFORE deleting state file. If verification fails, log warning and keep state file for retry."
            status: "TODO"
          - id: "CLM-004"
            source: "F-01"
            severity: "Critical"
            title: "scope_translator.py auto-expands domains to wildcards"
            description: "scope_translator.py lines 272-274 expand target.example.com to *.target.example.com. A scope authorizing one specific domain silently permits all subdomains. Fix: remove automatic wildcard expansion; require explicit wildcard in scope document if subdomains are authorized."
            status: "TODO"
          - id: "CLM-005"
            source: "F-06"
            severity: "High"
            title: "Named Docker volumes survive teardown leaking data between engagements"
            description: "Volumes like msf-pgdata and envoy-z3-logs persist after docker compose down, leaking Metasploit loot and Envoy access logs between engagements. Fix: use --volumes flag on teardown AND verify volume removal. Consider engagement-scoped volume naming."
            status: "TODO"
          - id: "CLM-006"
            source: "F-07"
            severity: "High"
            title: "Docker socket access grants host-equivalent privilege"
            description: "The orchestrator runs docker compose commands via the Docker socket which grants host-level access. This is an accepted trust assumption but must be explicitly documented in the ADR and SKILL.md security model."
            status: "TODO"
          - id: "CLM-007"
            source: "F-10"
            severity: "Medium"
            title: "Mutable image tags enable supply chain substitution"
            description: "Docker images use mutable tags like envoyproxy/envoy:v1.31-latest and bcsecurity/empire:latest. A compromised registry could substitute malicious images. Fix: pin base images by digest in Dockerfiles."
            status: "TODO"

